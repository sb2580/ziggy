<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ziggy's Math Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math Quest">
<meta name="theme-color" content="#7fc9ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#8fd6ff; --sky2:#d9f2ff; --ground:#7ddc7d; --ground2:#4fbf68;
  --ink:#26333f; --ink2:#5b6b78;
  --gold:#ffc531; --gold-d:#e09a00;
  --gem:#3ddcff; --gem-d:#0aa9d6;
  --good:#3ec46d; --good-d:#249a4e;
  --bad:#ff6b6b; --bad-d:#d63d3d;
  --card:#ffffff; --shadow:rgba(20,40,60,.18); --horizon:56vh;
  --font:'Fredoka','Baloo 2','Varela Round',-apple-system,'Segoe UI Rounded','Segoe UI',system-ui,sans-serif;
}
body.darkbg .title{color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.35);}
body.darkbg .subtitle{color:#dfe7ff;}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{overscroll-behavior:none;}
body{
  margin:0; font-family:var(--font); color:var(--ink);
  -webkit-touch-callout:none; overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:#8fd6ff;
  overflow-x:hidden; touch-action:manipulation;
  user-select:none; -webkit-user-select:none;
}
#app{max-width:520px; margin:0 auto; min-height:100%; padding:10px 14px 150px; position:relative; z-index:3;
  pointer-events:none;}
#app *{pointer-events:auto;}
#app .bubble{pointer-events:none;}
button{font-family:inherit;}

/* ---------- ambient background ---------- */
/* ---------- living world ---------- */
#world{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
#world .bg{position:absolute; inset:0; opacity:0; transition:opacity 1.3s ease;}
#world .layer{position:absolute; inset:0; opacity:1; transition:opacity .55s ease;}
.far{position:absolute; left:-2%; right:-2%; bottom:calc(100% - var(--horizon)); height:26vh;}
.far svg{width:100%; height:100%; display:block;}
.prop{position:absolute; bottom:calc(100% - var(--horizon) - 4px); line-height:1; filter:drop-shadow(0 4px 3px rgba(0,0,0,.18));}
.skyob{position:absolute; line-height:1; --flip:scaleX(1);}
.cloud{position:absolute; background:#fff; border-radius:100px; opacity:.8;}
.cloud:before,.cloud:after{content:''; position:absolute; background:#fff; border-radius:50%;}
@keyframes drift{from{transform:translateX(-40vw)} to{transform:translateX(140vw)}}
.sun{position:absolute; border-radius:50%;}
.p{position:absolute; pointer-events:none;}
@keyframes pfall{from{top:-10%} to{top:106%}}
@keyframes prise{from{top:106%} to{top:-10%}}
@keyframes psway{from{margin-left:-16px} to{margin-left:16px}}
@keyframes pspin{from{transform:rotate(-50deg)} to{transform:rotate(50deg)}}
@keyframes twink{from{opacity:.12; transform:scale(.55)} to{opacity:1; transform:scale(1.25)}}
@keyframes blow{from{left:-12%} to{left:112%}}
.p.snow,.p.petal,.p.leaf{animation-name:pfall,psway; animation-timing-function:linear,ease-in-out; animation-iteration-count:infinite; animation-direction:normal,alternate;}
.p.leaf{border-radius:60% 8% 60% 8%;}
.p.petal{border-radius:60% 60% 60% 8%;}
.p.snow{border-radius:50%; background:#fff;}
.p.bub{border-radius:50%; background:rgba(255,255,255,.35); border:1.5px solid rgba(255,255,255,.75);
  animation-name:prise,psway; animation-timing-function:linear,ease-in-out; animation-iteration-count:infinite; animation-direction:normal,alternate;}
.p.star{border-radius:50%; background:#fff; animation:twink ease-in-out infinite alternate;}
.p.sand{height:3px; border-radius:3px; background:rgba(255,238,200,.75); animation:blow linear infinite;}

/* ---------- critters ---------- */
#critters{position:fixed; left:0; right:0; bottom:0; height:170px; z-index:2; pointer-events:none;
  overflow:hidden; opacity:1; transition:opacity .55s ease;}
.critter{position:absolute; border:0; background:none; padding:6px; margin:-6px; line-height:1; cursor:pointer;
  pointer-events:auto; animation-timing-function:linear; animation-iteration-count:infinite;
  animation-duration:var(--dur,26s); filter:drop-shadow(0 4px 3px rgba(0,0,0,.22));}
@keyframes walkR{from{left:-16%} to{left:112%}}
@keyframes walkL{from{left:112%} to{left:-16%}}
.crbody{display:inline-block; animation:bobw .5s ease-in-out infinite;}
@keyframes bobw{0%,100%{transform:translateY(0) var(--flip)} 50%{transform:translateY(-6px) var(--flip)}}
.critter.fly .crbody{animation:floatw 2.2s ease-in-out infinite;}
@keyframes floatw{0%,100%{transform:translateY(0) var(--flip)} 50%{transform:translateY(-16px) var(--flip)}}
.critter.react .crbody{animation:critJump .7s ease;}
@keyframes critJump{0%{transform:translateY(0) var(--flip)} 25%{transform:translateY(-46px) var(--flip)}
  50%{transform:translateY(0) var(--flip)} 68%{transform:translateY(-18px) var(--flip)} 100%{transform:translateY(0) var(--flip)}}
.critter.spinme .crbody{animation:critSpin .7s ease;}
@keyframes critSpin{0%{transform:rotate(0) var(--flip)} 100%{transform:rotate(360deg) var(--flip)}}
.critter.grow .crbody{animation:critGrow .8s cubic-bezier(.3,1.6,.5,1);}
@keyframes critGrow{0%,100%{transform:scale(1) var(--flip)} 40%{transform:scale(1.75) var(--flip)}}
.zmouth .ziggy{width:100% !important; animation:none;}
.pop{position:absolute; pointer-events:none; font-size:20px; animation:popUp .95s ease-out forwards;}
@keyframes popUp{to{transform:translate(var(--dx),-84px) scale(1.5) rotate(var(--dr)); opacity:0}}
.toast{position:absolute; pointer-events:none; font-weight:700; font-size:19px; color:#fff;
  text-shadow:0 2px 4px rgba(0,0,0,.45); animation:popUp 1.1s ease-out forwards;}
.biometoast{pointer-events:none; position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-70px); z-index:50;
  background:rgba(255,255,255,.94); border-radius:999px; padding:9px 20px; font-weight:600; font-size:18px;
  box-shadow:0 6px 18px rgba(0,0,0,.2); transition:transform .5s cubic-bezier(.2,1.5,.4,1), opacity .5s; opacity:0;}
.biometoast.show{transform:translateX(-50%) translateY(0); opacity:1;}

/* ---------- shared UI ---------- */
.btn{
  border:0; border-radius:18px; padding:14px 18px; font-size:19px; font-weight:600;
  color:#fff; background:var(--good); box-shadow:0 6px 0 var(--good-d); cursor:pointer;
  transition:transform .08s, box-shadow .08s, filter .15s;
}
.btn:active{transform:translateY(5px); box-shadow:0 1px 0 var(--good-d);}
.btn.gold{background:var(--gold); color:#5b3d00; box-shadow:0 6px 0 var(--gold-d);}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d);}
.btn.ghost{background:#fff; color:var(--ink); box-shadow:0 6px 0 #cfdae2;}
.btn.ghost:active{box-shadow:0 1px 0 #cfdae2;}
.btn[disabled]{filter:grayscale(.7) opacity(.6); pointer-events:none;}
.card{background:var(--card); border-radius:26px; box-shadow:0 10px 0 rgba(0,0,0,.07), 0 14px 30px var(--shadow);}

/* ---------- top bar ---------- */
.topbar{display:flex; align-items:center; gap:7px; padding:6px 2px 12px;}
@media (max-width:400px){
  .iconbtn{width:36px; height:36px; font-size:17px; border-radius:12px;}
  .pill{padding:5px 9px 5px 6px; font-size:15px;}
  .topbar{gap:5px;}
}
.pill{
  display:flex; align-items:center; gap:6px; background:#fff; border-radius:999px;
  padding:6px 12px 6px 8px; font-weight:600; font-size:16px; box-shadow:0 3px 0 rgba(0,0,0,.08);
}
.pill .ic{font-size:18px;}
.iconbtn{
  width:42px; height:42px; border-radius:14px; border:0; background:#fff; font-size:20px;
  box-shadow:0 4px 0 rgba(0,0,0,.08); cursor:pointer; display:grid; place-items:center;
}
.iconbtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.08);}
.spacer{flex:1}

/* ---------- ziggy ---------- */
.ziggy-wrap{display:grid; place-items:center; position:relative;}
.ziggy{width:190px; animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-10px) rotate(1deg)}}
.ziggy.happy{animation:jump .5s ease 2;}
@keyframes jump{0%{transform:translateY(0) scale(1)} 30%{transform:translateY(-26px) scale(1.08,.94)} 60%{transform:translateY(0) scale(.94,1.06)} 100%{transform:translateY(0) scale(1)}}
.ziggy.sad{animation:shakeh .45s ease 1;}
@keyframes shakeh{0%,100%{transform:rotate(0)} 25%{transform:rotate(-7deg) translateY(6px)} 75%{transform:rotate(7deg) translateY(6px)}}
.ziggy.spin{animation:spin .7s ease 1;}
@keyframes spin{to{transform:rotate(360deg) scale(1.05)}}
.eyelid{transform-origin:center; animation:blink 4.2s infinite;}
@keyframes blink{0%,96%,100%{transform:scaleY(0)} 98%{transform:scaleY(1)}}

.bubble{
  position:absolute; top:-6px; right:-4px; background:#fff; border-radius:18px 18px 18px 4px;
  padding:9px 14px; font-weight:600; font-size:17px; box-shadow:0 4px 0 rgba(0,0,0,.08);
  opacity:0; transform:scale(.6) translateY(10px); transition:.22s cubic-bezier(.3,1.6,.5,1); pointer-events:none;
}
.bubble.show{opacity:1; transform:scale(1) translateY(0);}
body.rtl .bubble{right:auto; left:-4px; border-radius:18px 18px 4px 18px;}

/* ---------- map ---------- */
.title{font-size:30px; font-weight:700; text-align:center; margin:2px 0 0; text-shadow:0 3px 0 rgba(255,255,255,.6);}
.subtitle{text-align:center; color:var(--ink2); font-weight:500; margin:2px 0 10px;}
.map{display:flex; flex-direction:column; gap:6px; margin-top:6px;}
.node{
  display:flex; align-items:center; gap:14px; background:#fff; border:0; text-align:start;
  border-radius:24px; padding:12px 16px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.09);
  transition:transform .08s, box-shadow .08s;
}
.node:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.09);}
.node.locked{filter:grayscale(1) opacity(.55); cursor:default;}
.node .orb{
  width:60px; height:60px; border-radius:50%; display:grid; place-items:center; font-size:30px; flex:none;
  background:radial-gradient(circle at 32% 28%, #fff9, transparent 60%), var(--gold);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.15);
}
.node h3{margin:0; font-size:19px; font-weight:600;}
.node p{margin:2px 0 0; font-size:14px; color:var(--ink2); font-weight:500;}
.stars{font-size:15px; letter-spacing:1px;}
.connector{height:16px; width:6px; background:repeating-linear-gradient(180deg,#fff 0 6px,transparent 6px 12px); margin:0 auto; border-radius:3px; opacity:.8;}

/* ---------- question ---------- */
.progress{flex:1; height:16px; background:rgba(255,255,255,.65); border-radius:999px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
.progress i{display:block; height:100%; width:0; background:linear-gradient(180deg,#ffe071,var(--gold)); border-radius:999px; transition:width .35s cubic-bezier(.3,1.4,.5,1);}
.hearts{font-size:19px; letter-spacing:-1px;}
.hearts span{transition:.3s;}
.hearts span.gone{filter:grayscale(1); opacity:.35; transform:scale(.8); display:inline-block;}

.qcard{padding:18px 16px 20px; margin-top:6px; text-align:center; position:relative; overflow:hidden;}
.qcard.golden{background:linear-gradient(160deg,#fff8dd,#ffeeb0); box-shadow:0 0 0 4px var(--gold), 0 10px 0 var(--gold-d), 0 14px 30px var(--shadow);}
.goldtag{display:inline-block; background:var(--gold); color:#5b3d00; font-weight:700; font-size:13px; padding:4px 12px; border-radius:999px; margin-bottom:6px;}
.qtext{font-size:44px; font-weight:700; margin:6px 0 4px; letter-spacing:1px; direction:ltr;}
.qhint{font-size:15px; color:var(--ink2); font-weight:500; margin:0;}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
.ans{
  border:0; background:#fff; border-radius:20px; padding:18px 8px; font-size:30px; font-weight:700; color:var(--ink);
  box-shadow:0 6px 0 #cfdae2; cursor:pointer; transition:transform .08s, box-shadow .08s, background .2s; direction:ltr;
}
.ans:active{transform:translateY(4px); box-shadow:0 2px 0 #cfdae2;}
.ans.right{background:var(--good); color:#fff; box-shadow:0 6px 0 var(--good-d); animation:pop .3s;}
.ans.wrong{background:var(--bad); color:#fff; box-shadow:0 6px 0 var(--bad-d); animation:shakeh .35s;}
@keyframes pop{50%{transform:scale(1.12)}}
.dots{display:inline-grid; gap:6px; margin:8px 0 2px; justify-content:center;}
.dot{width:22px; height:22px; border-radius:50%; background:var(--gold); box-shadow:inset 0 -3px 0 rgba(0,0,0,.15); animation:popin .3s backwards;}
@keyframes popin{from{transform:scale(0)}}

.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
.key{border:0; background:#fff; border-radius:16px; padding:16px 0; font-size:26px; font-weight:600; box-shadow:0 5px 0 #cfdae2; cursor:pointer;}
.key:active{transform:translateY(3px); box-shadow:0 2px 0 #cfdae2;}
.key.wide{grid-column:span 1;}
.typed{font-size:40px; font-weight:700; min-height:52px; border-bottom:5px dashed #cfdae2; display:inline-block; min-width:120px; direction:ltr;}

.footer{position:sticky; bottom:0; padding:14px 0 6px; display:flex; gap:10px; align-items:center;}
.footer .btn{flex:1;}
.feedback{border-radius:22px; padding:12px 16px; font-weight:600; display:flex; align-items:center; gap:10px; margin-top:14px;}
.feedback.ok{background:#dcfbe7; color:#166534;}
.feedback.no{background:#ffe0e0; color:#9b1c1c;}
.feedback .big{font-size:26px;}

/* ---------- results / chest ---------- */
.center{text-align:center;}
.bigstars{font-size:48px; letter-spacing:6px; margin:6px 0;}
.bigstars span{display:inline-block; animation:starIn .5s backwards cubic-bezier(.3,1.7,.5,1);}
@keyframes starIn{from{transform:scale(0) rotate(-90deg); opacity:0}}
.rewardrow{display:flex; justify-content:center; gap:14px; margin:10px 0 4px; flex-wrap:wrap;}
.reward{background:#fff; border-radius:18px; padding:10px 16px; font-weight:700; font-size:20px; box-shadow:0 5px 0 rgba(0,0,0,.08);}
.chests{display:flex; gap:12px; justify-content:center; margin:18px 0;}
.chest{font-size:64px; cursor:pointer; background:none; border:0; transition:transform .15s; animation:wiggle 1.6s ease-in-out infinite;}
.chest:nth-child(2){animation-delay:.2s} .chest:nth-child(3){animation-delay:.4s}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)}}
.chest:active{transform:scale(.9);}
.chest.opened{animation:chestPop .6s forwards;}
@keyframes chestPop{40%{transform:scale(1.3) rotate(0)} 100%{transform:scale(1.15)}}

/* ---------- minigames ---------- */
.arena{position:relative; height:360px; border-radius:26px; overflow:hidden; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.85)); margin-top:10px; box-shadow:inset 0 4px 12px rgba(0,0,0,.06);}
.fruit{
  position:absolute; top:-70px; width:62px; height:62px; border-radius:50%; display:grid; place-items:center;
  font-size:24px; font-weight:700; color:#fff; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.18);
  animation-name:fall; animation-timing-function:linear; animation-fill-mode:forwards; direction:ltr;
}
@keyframes fall{to{top:380px}}
.fruit.hit{animation:burst .3s forwards;}
@keyframes burst{to{transform:scale(1.8); opacity:0}}
.timerbar{height:14px; background:rgba(255,255,255,.6); border-radius:999px; overflow:hidden; margin-top:10px;}
.timerbar i{display:block; height:100%; background:linear-gradient(180deg,#ff9a9a,var(--bad)); width:100%;}

/* ---------- shop ---------- */
.shopgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
.item{background:#fff; border-radius:20px; padding:12px; text-align:center; box-shadow:0 5px 0 rgba(0,0,0,.08);}
.item svg{width:74px; height:74px;}
.item h4{margin:2px 0 6px; font-size:16px; font-weight:600;}
.item .btn{padding:8px 12px; font-size:15px; width:100%;}
.badge{position:absolute; top:-6px; inset-inline-end:-6px; background:var(--bad); color:#fff; border-radius:999px; font-size:11px; padding:2px 7px; font-weight:700;}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:99;}
.screen{animation:slideIn .35s cubic-bezier(.2,.9,.3,1);}
@keyframes slideIn{from{opacity:0; transform:translateY(14px)}}
.roomwrap{border-radius:22px; overflow:hidden; box-shadow:0 10px 0 rgba(0,0,0,.08), 0 14px 30px var(--shadow); margin-top:6px; background:#fff;}
.roomsvg{display:block; width:100%; height:auto;}
.swatches{display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:12px;}
.swatch{width:38px; height:38px; border-radius:12px; border:3px solid #fff; cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.14); transition:transform .1s;}
.swatch:active{transform:scale(.9);}
.swatch.on{outline:3px solid var(--gold); outline-offset:2px;}
.fprev{width:100%; height:70px; display:block;}
.item .fprev{margin-bottom:2px;}
.hidden{display:none !important;}
.small .ziggy{width:112px;}
:focus-visible{outline:4px solid #2b6fff; outline-offset:3px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}
</style>
</head>
<body>
<div id="world" aria-hidden="true">
  <div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
  <div class="layer" id="skyLayer"></div>
  <div class="layer" id="farLayer"></div>
  <div class="layer" id="fxLayer"></div>
</div>
<div id="critters"></div>
<div class="biometoast" id="biomeToast"></div>
<canvas id="confetti"></canvas>
<div id="app"></div>

<script>
/* ============================================================
   Ziggy's Math Quest - single file, no dependencies
   ============================================================ */

/* ---------- tiny helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const app = $('#app');
const ri = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- language ---------- */
const T = {

  retry:{en:"Try again", he:"נסי שוב"},
  toMap:{en:"Back to map", he:"חזרה למפה"},
  bonus:{en:"Bonus game!", he:"משחק בונוס!"},
  chestPick:{en:"Pick a treasure chest!", he:"בחרי תיבת אוצר!"},
  speedTitle:{en:"Speed Round", he:"סבב מהיר"},

  needCoins:{en:"Not enough coins", he:"אין מספיק מטבעות"},
  practice:{en:"Mixed practice", he:"תרגול מעורב"},
  anyTime:{en:"Open any time", he:"פתוח תמיד"},
  house:{en:"Monster House", he:"בית המפלצת"},
  houseSub:{en:"Decorate your room", he:"עצבי את החדר שלך"},
  wallpaper:{en:"Room style", he:"סגנון החדר"},

/* ---------- sound: a tiny synth ---------- */
let actx=null, master=null;
function ac(){
  if(!actx){
    try{
      actx = new (window.AudioContext||window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value=0.9; master.connect(actx.destination);
    }catch(e){ return null; }
  }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
const mtof = m => 440*Math.pow(2,(m-69)/12);

/* one soft, slightly detuned voice with a proper envelope */
function voice(midi, when, dur, o={}){
  if(S.muted) return; const c=ac(); if(!c) return;
  const t0=c.currentTime+when, f=mtof(midi);
  const g=c.createGain(), lp=c.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.setValueAtTime(o.cut||3400,t0);
  const o1=c.createOscillator(), o2=c.createOscillator();
  o1.type=o.type||'triangle'; o2.type=o.type2||'sine';
  o1.frequency.setValueAtTime(f,t0);
  o2.frequency.setValueAtTime(f*(o.det||1.004),t0);
  if(o.slide) o1.frequency.exponentialRampToValueAtTime(mtof(midi+o.slide),t0+dur);
  const v=o.vol==null?.15:o.vol, a=o.a||.014, r=o.r||dur;
  g.gain.setValueAtTime(.0001,t0);
  g.gain.linearRampToValueAtTime(v,t0+a);
  g.gain.exponentialRampToValueAtTime(.0001,t0+a+r);
  o1.connect(g); o2.connect(g); g.connect(lp); lp.connect(master||c.destination);
  o1.start(t0); o2.start(t0); o1.stop(t0+a+r+.06); o2.stop(t0+a+r+.06);
}
const tune = (notes,o={}) => notes.forEach(n=>voice(n[0],n[1],n[2],o));

const cvs = $('#confetti'), ctx = cvs.getContext('2d');
let parts=[], rafId=null;
function sizeCanvas(){ cvs.width=innerWidth; cvs.height=innerHeight; }
addEventListener('resize',sizeCanvas); sizeCanvas();
function confetti(n=90, colors=['#ffc531','#ff6bb5','#3ddcff','#3ec46d','#a78bfa','#ff8b5c']){
  for(let i=0;i<n;i++) parts.push({
    x:innerWidth/2+ri(-90,90), y:innerHeight*0.36+ri(-40,40),
    vx:ri(-70,70)/10, vy:ri(-95,-25)/10, g:.28,
    s:ri(6,13), r:Math.random()*6, vr:ri(-20,20)/50,
    c:pick(colors), life:110
  });
  if(!rafId) rafId=requestAnimationFrame(drawParts);
}
function drawParts(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts = parts.filter(p=>p.life>0 && p.y<cvs.height+40);
  parts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.r+=p.vr; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore();
  });
  if(parts.length) rafId=requestAnimationFrame(drawParts);
  else { ctx.clearRect(0,0,cvs.width,cvs.height); rafId=null; }
}

/* ---------- question generation ---------- */
function distract(ans, kind, a, b){
  const cand = kind==='mul'
    ? [ans+a, ans-a, ans+b, ans-b, ans+1, ans-1, ans+10, ans-10, a+b, ans+2, ans-2, ans+a+b]
    : [ans+1, ans-1, ans+2, ans-2, ans+10, ans-10, ans+3, ans-3, ans+5];
  const out=new Set(); shuffle(cand);
  for(const c of cand){ if(c>0 && c!==ans && !out.has(c)) out.add(c); if(out.size===3) break; }
  let k=2; while(out.size<3){ if(ans+k>0 && ans+k!==ans) out.add(ans+k); k++; }
  return [...out].slice(0,3);
}
function addSubQ(tier){
  const cap = tier==='easy' ? 12 : 30;
  if(Math.random()<.5){
    const x=ri(2,cap), y=ri(2,cap);
    return {kind:'mc', text:`${x} + ${y}`, ans:x+y, opts:shuffle([x+y,...distract(x+y,'add')]), sub:''};
  }
  const x=ri(6,cap+8), y=ri(2,Math.min(x-1,cap));
  return {kind:'mc', text:`${x} − ${y}`, ans:x-y, opts:shuffle([x-y,...distract(x-y,'add')]), sub:''};
}
function mulQ(tier){
  const a = pick(TIER_TABLES[tier]), b = ri(1,10), ans = a*b;
  // easier tiers get friendlier, more visual formats; harder tiers get trickier ones
  let fmt;
  if(tier==='easy')      fmt = pick(['mc','mc','mc','array']);
  else if(tier==='med')  fmt = pick(['mc','mc','array','missing']);
  else                   fmt = pick(['mc','missing','type','mc']);

  if(fmt==='array'){
    return {kind:'array', a, b, text:`${a} × ${b}`, ans, opts:shuffle([ans,...distract(ans,'mul',a,b)]), sub:t('howMany')};
  }
  if(fmt==='missing'){
    const shownFirst = Math.random()<.5;
    const text = shownFirst ? `${a} × ? = ${ans}` : `? × ${b} = ${ans}`;
    const mAns = shownFirst ? b : a;
    return {kind:'mc', text, ans:mAns, opts:shuffle([mAns,...distract(mAns,'add')]), sub:t('missing'), hint:[a,b]};
  }
  if(fmt==='type'){
    return {kind:'type', text:`${a} × ${b}`, ans, sub:t('typeIt'), hint:[a,b]};
  }
  return {kind:'mc', text:`${a} × ${b}`, ans, opts:shuffle([ans,...distract(ans,'mul',a,b)]), sub:'', hint:[a,b]};
}
function makeQuestion(world){
  const W = WORLDS[world];
  const tier = rollTier(W.mix);
  // fold in some addition/subtraction to keep it varied (mostly at easier tiers)
  if(tier==='easy' && Math.random()<.30) return addSubQ('easy');
  if(tier==='med'  && Math.random()<.15) return addSubQ('med');
  return mulQ(tier);
}

function nextQuestion(){

function heartsHTML(){
  return `<div class="hearts">${[0,1,2].map(i=>`<span class="${i<L.hearts?'':'gone'}">❤️</span>`).join('')}</div>`;
}
function renderQuestion(){
  const q=L.q;
  const pct = L.practice ? (L.correct%10)*10 : (L.idx/QUESTIONS_PER_LEVEL)*100;
  let body='';

  if(q.kind==='array'){
    const dots = Array.from({length:q.a*q.b},(_,i)=>`<div class="dot" style="animation-delay:${i*22}ms"></div>`).join('');
    body = `<div class="dots" style="grid-template-columns:repeat(${q.b},22px)">${dots}</div>`;
  }
  if(q.kind==='mc' || q.kind==='array'){
    body += `<div class="answers">${q.opts.map(o=>`<button class="ans" onclick="answer(${o},this)">${o}</button>`).join('')}</div>`;
  }
  if(q.kind==='type'){
    body += `<div><span class="typed" id="typed">${L.typed||'&nbsp;'}</span></div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="tkey('${n}')">${n}</button>`).join('')}

      <button class="key" style="background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-d)" onclick="tkey('ok')">✓</button>
    </div>`;
  }

  app.innerHTML = topbar(`<button class="iconbtn" onclick="quitLevel()">✕</button>
    <div class="progress"><i style="width:${pct}%"></i></div>${heartsHTML()}`) + `
  <div class="screen">
    <div class="small" style="display:flex;align-items:flex-end;margin-bottom:-16px;position:relative;z-index:3">
      ${ziggyBlock('idle','')}
    </div>
    <div class="card qcard ${q.golden?'golden':''}">
      ${q.golden?`<div class="goldtag">✨ ${t('double')} ✨</div>`:''}
      ${q.sub?`<p class="qhint">${q.sub}</p>`:''}
      <div class="qtext">${q.kind==='array'?'':q.text}${q.kind==='mc'&&!q.text.includes('=')?' = ?':''}</div>
      ${q.kind==='array'?`<p class="qhint">${q.text}</p>`:''}
      ${body}
      <div id="fb"></div>
    </div>
    ${q.hint?`<div class="center" style="margin-top:12px"><button class="btn ghost" style="padding:8px 16px;font-size:15px" onclick="showHint(this)">💡 ${t('hint')}</button></div>`:''}
  </div>`;
}
function showHint(btn){
  sfx.pop();
  const [a,b]=L.q.hint;
  const dots = Array.from({length:a*b},(_,i)=>`<div class="dot" style="width:14px;height:14px;animation-delay:${i*14}ms"></div>`).join('');

function tkey(k){
  sfx.click();
  if(k==='del') L.typed=L.typed.slice(0,-1);
  else if(k==='ok'){ if(L.typed==='') return; return answer(parseInt(L.typed,10), null); }
  else if(L.typed.length<3) L.typed+=k;
  const el=$('#typed'); if(el) el.innerHTML = L.typed||'&nbsp;';

function answer(val, btn){
  if(L.answered) return; L.answered=true;
  const q=L.q, ok = val===q.ans;

  const kp=$('.keypad'); if(kp){ kp.style.pointerEvents='none'; kp.style.opacity='.45'; }
  const ty=$('#typed'); if(ty){ ty.innerHTML = ok? String(val) : `<s style="opacity:.45">${val}</s> ${q.ans}`; }
  document.querySelectorAll('.ans').forEach(b=>{
    const v=parseInt(b.textContent,10);
    if(v===q.ans) b.classList.add('right');
    else if(b===btn) b.classList.add('wrong');
    b.onclick=null;
  });

  const fb=$('#fb');
  if(ok){
    sfx.correct(); L.correct++; L.streak++;
    let coins = 5 + (q.golden?10:0);
    if(q.golden) coins = 15;
    if(L.streak>=3) coins += 2;
    L.coins += coins; addCoins(coins); sfx.coin();
    setMood('happy'); say(pick(PRAISE[LANG]));
    fb.innerHTML = `<div class="feedback ok"><span class="big">🎉</span><div>${t('correct')} +${coins} 🪙${L.streak>=3?` · 🔥 ${L.streak}`:''}</div></div>`;
    if(L.streak>0 && L.streak%5===0){
      L.gems++; addGems(1); sfx.gem(); confetti(70);
      fb.innerHTML += `<div class="feedback ok" style="background:#dff6ff;color:#065986"><span class="big">💎</span><div>${t('onFire')} ${t('gem')} +1</div></div>`;
    }
  }else{
    sfx.wrong(); L.streak=0; L.hearts--;
    setMood('sad'); say(pick(NUDGE[LANG]));
    fb.innerHTML = `<div class="feedback no"><span class="big">💧</span><div>${t('answerIs')} <b style="font-size:22px">${q.ans}</b></div></div>`;
    document.querySelectorAll('.hearts span')[L.hearts]?.classList.add('gone');
  }

  const foot=document.createElement('div');
  foot.className='footer';
  foot.innerHTML = `<button class="btn ${ok?'':'ghost'}" onclick="afterAnswer()">${t('cont')} →</button>`;
  $('.screen').appendChild(foot);
  foot.querySelector('.btn').focus();
}

      ${[0,1,2].map(i=>`<button class="chest" onclick="openChest(this,${i})">🎁</button>`).join('')}

}
function openChest(btn,i){
  document.querySelectorAll('.chest').forEach(c=>c.onclick=null);
  btn.classList.add('opened'); btn.textContent='📦';
  sfx.chest(); confetti(120);
  const roll=Math.random();
  let text, coins=0, gems=0;
  if(roll<.15){ gems=3; text='💎💎💎'; }
  else if(roll<.45){ coins=60; text='🪙 60'; }
  else if(roll<.8){ coins=35; text='🪙 35'; }
  else { coins=100; gems=1; text='🪙 100 + 💎'; }
  addCoins(coins); addGems(gems);
  setTimeout(()=>{ btn.textContent='🏆'; },400);
  $('#chestOut').innerHTML = `<div class="reward" style="display:inline-block;font-size:26px">${text}</div>
    <div style="height:16px"></div>
    <button class="btn" style="width:100%" onclick="screenMap()">${t('toMap')}</button>`;
}

  </div>`;
}
function speedStart(){
  sfx.click();
  SP={score:0, time:25, timer:null, q:null};
  speedRender();
  SP.timer=setInterval(()=>{
    SP.time-=0.1;
    const bar=$('#tbar'); if(bar) bar.style.width=(SP.time/25*100)+'%';
    if(SP.time<=5.05 && Math.abs(SP.time%1)<0.06) sfx.tick();
    if(SP.time<=0){ clearInterval(SP.timer); speedEnd(); }
  },100);
}
function speedRender(){
  const w = Math.min(S.unlocked-1, 4);
  const tier = rollTier(WORLDS[w].mix);
  const a=pick(TIER_TABLES[tier]), b=ri(1,10), ans=a*b;
  SP.q={a,b,ans,opts:shuffle([ans,...distract(ans,'mul',a,b)])};
  app.innerHTML = topbar(`<button class="iconbtn" onclick="screenMap()">✕</button>`) + `<div class="screen center">
    <div class="timerbar"><i id="tbar" style="width:${SP.time/25*100}%"></i></div>
    <div class="card qcard" style="margin-top:14px">
      <p class="qhint">⚡ ${t('speedTitle')} · ⭐ <b id="spScore">${SP.score}</b></p>
      <div class="qtext">${a} × ${b}</div>
      <div class="answers">${SP.q.opts.map(o=>`<button class="ans" onclick="speedAns(${o})">${o}</button>`).join('')}</div>
    </div>
  </div>`;
}
function speedAns(v){
  if(v===SP.q.ans){ SP.score++; sfx.pop(); addCoins(4); }
  else { sfx.wrong(); SP.time=Math.max(0.2,SP.time-2); }
  speedRender();
}
function speedEnd(){
  confetti(100); sfx.level();
  const bonus = SP.score*4;
  app.innerHTML = topbar('') + `<div class="screen center">
    ${ziggyBlock('happy',pick(PRAISE[LANG]))}
    <h1 class="title">${t('timeUp')}</h1>
    <div class="rewardrow"><div class="reward">⭐ ${SP.score}</div><div class="reward">🪙 +${bonus}</div></div>
    <div style="height:14px"></div>
    <button class="btn" style="width:100%" onclick="screenMap()">${t('toMap')}</button>
  </div>`;
}

function feedIntro(){

function feedStart(n){
  sfx.click();
  FG={n, score:0, time:22, spawner:null, timer:null};
  app.innerHTML = topbar(`<button class="iconbtn" onclick="screenMap()">✕</button>`) + `<div class="screen center">
    <div class="timerbar"><i id="fbar"></i></div>
    <p class="subtitle" style="margin:8px 0 0">${t('feedSub')} <b style="font-size:20px">${n}</b> ${t('table')} · 🍎 <b id="fScore">0</b></p>
    <div class="arena" id="arena"></div>
  </div>`;
  $('#arena').innerHTML = `<div class="zmouth" style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:96px;pointer-events:none;opacity:.9">${ziggySVG('wow')}</div>`;
  FG.spawner=setInterval(()=>{
    const arena=$('#arena'); if(!arena) return;
    const good=Math.random()<.5;
    const val = good ? FG.n*ri(1,10) : (()=>{ let v; do{ v=ri(2,90);}while(v%FG.n===0); return v; })();
    const d=document.createElement('div');
    d.className='fruit';
    d.style.left = ri(4,74)+'%';
    d.style.background = good ? 'linear-gradient(180deg,#ff8fa3,#ff5d8f)' : 'linear-gradient(180deg,#9fb3c8,#6b7f95)';
    d.style.animationDuration = ri(32,46)/10+'s';
    d.textContent = val;
    d.onclick=()=>{
      if(d.classList.contains('hit')) return;
      d.classList.add('hit');
      if(val%FG.n===0){ FG.score++; sfx.pop(); addCoins(3); $('#fScore').textContent=FG.score; }
      else { sfx.wrong(); FG.time=Math.max(.3,FG.time-1.5); }
      setTimeout(()=>d.remove(),320);
    };
    d.addEventListener('animationend',()=>d.remove());
    arena.appendChild(d);
  },620);
  FG.timer=setInterval(()=>{
    FG.time-=0.1;
    const bar=$('#fbar'); if(bar) bar.style.width=(FG.time/22*100)+'%';
    if(FG.time<=0){ clearInterval(FG.timer); clearInterval(FG.spawner); feedEnd(); }
  },100);
}
function feedEnd(){
  confetti(90); sfx.level();
  app.innerHTML = topbar('') + `<div class="screen center">
    ${ziggyBlock('happy',pick(PRAISE[LANG]))}
    <h1 class="title">${t('timeUp')}</h1>
    <div class="rewardrow"><div class="reward">🍎 ${FG.score}</div><div class="reward">🪙 +${FG.score*3}</div></div>
    <div style="height:14px"></div>
    <button class="btn" style="width:100%" onclick="screenMap()">${t('toMap')}</button>
  </div>`;
}

function screenShop(){
  sfx.click(); clearTimers(); setTheme('sky');
  const grid = ITEMS.map(it=>{
    const owned=S.owned.includes(it.id), on=S.equipped===it.id;
    const label = on ? t('worn') : owned ? t('wear') : `🪙 ${it.cost}`;
    const cls = on ? 'btn gold' : owned ? 'btn' : (S.coins>=it.cost?'btn gold':'btn ghost');
    return `<div class="item">
      <svg viewBox="30 20 140 110">${it.svg}</svg>
      <h4>${it.name[LANG]||it.name.en}</h4>
      <button class="${cls}" onclick="shopTap('${it.id}')">${label}</button>
    </div>`;
  }).join('');
  app.innerHTML = topbar('') + `<div class="screen center">
    ${ziggyBlock('idle','')}
    <h1 class="title">${t('shop')}</h1>
    <p class="subtitle" id="shopMsg">🪙 ${S.coins} · 💎 ${S.gems}</p>
    <div class="shopgrid">${grid}</div>
    <div style="height:16px"></div>
    <button class="btn ghost" style="width:100%" onclick="screenMap()">${t('back')}</button>
  </div>`;
}
function shopTap(id){
  const it=ITEMS.find(i=>i.id===id);
  if(S.owned.includes(id)){
    S.equipped = S.equipped===id ? null : id; sfx.pop();
  } else if(S.coins>=it.cost){
    S.coins-=it.cost; S.owned.push(id); S.equipped=id; sfx.gem(); confetti(80);
  } else {
    sfx.wrong(); const m=$('#shopMsg'); m.textContent=t('needCoins'); return;
  }
  persist(); screenShop();
}

function money(item){ return item.gems ? {kind:'gem', n:item.gems} : {kind:'coin', n:item.cost}; }
function canAfford(item){ const m=money(item); return m.kind==='gem' ? S.gems>=m.n : S.coins>=m.n; }
function priceLabel(item){ const m=money(item); return m.kind==='gem' ? `💎 ${m.n}` : `🪙 ${m.n}`; }

function renderRoom(){
  const th = ROOM_THEMES[S.house.theme] || ROOM_THEMES.cozy;
  const owned = FURNITURE.filter(f=>S.house.owned.includes(f.id)).sort((a,b)=>a.z-b.z);
  const back = owned.filter(f=>f.z<100).map(f=>f.svg).join('');
  return `<svg viewBox="0 0 400 300" class="roomsvg" aria-hidden="true">
    <defs>
      <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${th.wall}"/><stop offset="1" stop-color="${th.wall2}"/>
      </linearGradient>
      <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${th.floor}"/><stop offset="1" stop-color="${th.floor2}"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="400" height="300" rx="18" fill="url(#wallG)"/>
    <rect x="0" y="195" width="400" height="105" fill="url(#floorG)"/>
    <path d="M0 195 H400" stroke="rgba(0,0,0,.10)" stroke-width="3"/>
    <rect x="0" y="0" width="400" height="300" rx="18" fill="none" stroke="rgba(0,0,0,.06)" stroke-width="2"/>
    ${back}
    <svg x="150" y="118" width="120" height="120" viewBox="0 0 200 200">${ziggyInner('idle')}</svg>
  </svg>`;
}

function screenHouse(){
  sfx.click(); clearTimers();
  const empty = S.house.owned.length===0;
  const swatches = Object.entries(ROOM_THEMES).map(([k,th])=>`
    <button class="swatch ${S.house.theme===k?'on':''}" onclick="houseTheme('${k}')" title="${th.name[LANG]||th.name.en}"
      style="background:linear-gradient(135deg,${th.wall} 0 55%,${th.floor} 55% 100%)"></button>`).join('');

  const grid = FURNITURE.map(f=>{
    const owned = S.house.owned.includes(f.id);
    const [x,y,w,h]=f.box;
    const label = owned ? t('inRoom') : priceLabel(f);
    const cls = owned ? 'btn' : (canAfford(f)?'btn gold':'btn ghost');
    return `<div class="item">
      <svg viewBox="${x} ${y} ${w} ${h}" class="fprev">${f.svg}</svg>
      <h4>${f.name[LANG]||f.name.en}</h4>
      <button class="${cls}" ${owned?'disabled':''} onclick="houseBuy('${f.id}')">${label}</button>
    </div>`;
  }).join('');

  app.innerHTML = topbar('') + `<div class="screen center">
    <h1 class="title">🏠 ${t('house')}</h1>
    <p class="subtitle" id="houseMsg">🪙 ${S.coins} · 💎 ${S.gems}</p>
    <div class="roomwrap">${renderRoom()}</div>
    ${empty?`<p class="qhint" style="margin:8px 4px">${t('emptyRoom')}</p>`:''}
    <div class="swatches"><span class="qhint" style="align-self:center">${t('wallpaper')}:</span>${swatches}</div>
    <h3 style="margin:14px 0 2px;text-align:start">${t('furniture')}</h3>
    <div class="shopgrid">${grid}</div>
    <div style="height:16px"></div>
    <button class="btn ghost" style="width:100%" onclick="screenMap()">${t('back')}</button>
  </div>`;
}
function houseTheme(k){ if(ROOM_THEMES[k]){ S.house.theme=k; sfx.pop(); persist(); screenHouse(); } }
function houseBuy(id){
  const f=FURNITURE.find(i=>i.id===id); if(!f) return;
  if(S.house.owned.includes(id)) return;
  if(!canAfford(f)){ sfx.wrong(); const m=$('#houseMsg'); if(m) m.textContent=t('needCoins'); return; }
  const mm=money(f);
  if(mm.kind==='gem'){ S.gems-=mm.n; } else { S.coins-=mm.n; }
  S.house.owned.push(id); sfx.gem(); confetti(90); persist(); screenHouse();
}

/* ============================================================
   boot
   ============================================================ */
(async function boot(){
  await loadSave();
  document.body.classList.toggle('rtl',LANG==='he');
  document.documentElement.dir = LANG==='he'?'rtl':'ltr';
  setBiome('meadow', true);
  screenMap();
  const unlock=()=>{ ac(); ambientStart(); document.removeEventListener('pointerdown',unlock); };
  document.addEventListener('pointerdown',unlock);
})();
</script>
</body>
