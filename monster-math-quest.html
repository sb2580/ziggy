html,body{margin:0;padding:0;height:100%;overflow:hidden}
@supports(height:100dvh){html,body{height:100dvh}}
body{font-family:'Baloo 2','Fredoka','Varela Round','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;background:var(--sky2)}
button{font-family:inherit;touch-action:manipulation}
input{font-family:inherit}

/* ---------- scenery ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 62%);transition:background .6s linear}
#bg .sun{position:absolute;left:50%;top:8%;width:74px;height:74px;margin-left:-37px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 44px 18px rgba(255,255,255,.45);transition:top .6s,background .6s}
#bg .far{position:absolute;left:-8%;width:116%;height:30%;bottom:16%;background:var(--far);border-radius:50% 50% 0 0;opacity:.85}
#bg .near{position:absolute;left:-12%;width:124%;height:24%;bottom:8%;background:var(--near);border-radius:46% 54% 0 0}
#bg .ground{position:absolute;left:0;right:0;bottom:0;height:11%;background:var(--ground)}
.prop{position:absolute;transform:translate(-50%,-100%);line-height:1;pointer-events:none}
#zoo{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.critter{position:absolute;left:-16%;line-height:1;animation:walk 19s linear infinite;pointer-events:auto;cursor:pointer;will-change:transform}
.critter i{display:inline-block;font-style:normal;line-height:1;filter:drop-shadow(0 3px 0 rgba(44,28,70,.18))}
.critter.hit i{animation:critterhit .5s ease}
@keyframes critterhit{0%{transform:translateY(0) rotate(0) scale(1)}25%{transform:translateY(-22px) rotate(-16deg) scale(1.25)}55%{transform:translateY(0) rotate(14deg) scale(.9)}80%{transform:translateY(-8px) rotate(-6deg) scale(1.08)}100%{transform:translateY(0) rotate(0) scale(1)}}
.critter.flee{animation-duration:2.6s!important}
.puff{position:fixed;z-index:58;font-size:26px;pointer-events:none;animation:puff .9s ease-out forwards}
@keyframes puff{0%{transform:translate(-50%,0) scale(.4);opacity:0}25%{opacity:1;transform:translate(-50%,-26px) scale(1.2)}100%{transform:translate(-50%,-64px) scale(.8);opacity:0}}
@keyframes walk{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(90vw) scaleX(1)}50%{transform:translateX(90vw) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,calc(-100% - 9px))}}

#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
#app{position:relative;z-index:1;height:100%}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:8px 11px 62px;overflow-y:auto;overflow-x:hidden}
.screen.active{display:flex}

/* ---------- widgets ---------- */
.chip{background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:18px;font-weight:800;display:inline-flex;gap:5px;align-items:center;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.26) rotate(-4deg)}100%{transform:scale(1)}}
.btn{border:4px solid var(--ink);border-radius:20px;padding:12px 22px;font-size:22px;font-weight:900;background:var(--gold);color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.green{background:var(--green)}.btn.pink{background:var(--pink);color:#fff}.btn.plain{background:var(--cream)}
.btn.sm{font-size:17px;padding:8px 15px;border-width:3px;box-shadow:0 4px 0 var(--ink);border-radius:15px}
.icon-btn{border:3px solid var(--ink);border-radius:15px;background:var(--cream);width:44px;height:44px;font-size:20px;font-weight:800;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hud{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.title{font-size:min(9.5vw,40px);font-weight:900;margin:2px 0 4px;text-align:center;color:var(--cream);letter-spacing:.5px;
  text-shadow:3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 8px 0 rgba(44,28,70,.3)}
.sub-title{font-size:24px;font-weight:900;color:var(--cream);text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);margin:4px 0;text-align:center}
.bubble{flex:1 1 auto;min-width:0;position:relative;background:var(--cream);border:4px solid var(--ink);border-radius:18px;padding:9px 12px;font-size:18px;font-weight:800;max-width:250px;box-shadow:0 5px 0 var(--ink);line-height:1.25}
.bubble:empty{display:none}
.bubble::after{content:"";position:absolute;bottom:11px;right:-15px;border:9px solid transparent;border-left-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:12px}

/* ---------- avatar ---------- */
.mon-wrap{position:relative;display:flex;align-items:flex-end;justify-content:center}
.mon{width:100%;height:100%;overflow:visible}
.mbody{transform-box:fill-box;transform-origin:center bottom;animation:idlebob 2.8s ease-in-out infinite}
@keyframes idlebob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(1.2deg)}}
.mon.happy .mbody{animation:cheer .55s ease 2}
@keyframes cheer{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-15px) scale(1.05,.95)}60%{transform:translateY(0) scale(.96,1.04)}100%{transform:translateY(0) scale(1)}}
.mon.oops .mbody{animation:shakeh .45s ease}
@keyframes shakeh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-3deg)}60%{transform:translateX(7px) rotate(3deg)}}
.mon .eyes{animation:blink 5.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.mw-big{width:min(56vw,230px);height:min(56vw,230px)}
.mw-mid{width:150px;height:150px}
.mw-sm{width:98px;height:98px;flex:0 0 auto}
.mw-xs{width:62px;height:62px;flex:0 0 auto}
.bite{position:absolute;font-size:44px;line-height:1;pointer-events:none;transition:transform .32s ease,opacity .25s}

/* ---------- profiles ---------- */
.pcard{display:flex;align-items:center;gap:10px;width:100%;max-width:340px;background:var(--cream);border:4px solid var(--ink);border-radius:24px;padding:8px 14px 8px 8px;box-shadow:0 6px 0 var(--ink);cursor:pointer;margin-bottom:10px}
.pcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pcard .nm{font-size:22px;font-weight:900;line-height:1.1}
.pcard .st{font-size:14px;font-weight:700;opacity:.72}

/* ---------- builder ---------- */
.stage{position:relative;display:flex;justify-content:center;align-items:flex-end;margin:2px 0}
.tabs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.tab{border:3px solid var(--ink);border-radius:14px;background:var(--cream);padding:6px 10px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tab.on{background:var(--gold)}
.strip{display:flex;gap:8px;overflow-x:auto;width:100%;max-width:520px;padding:6px 2px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.opt-tile{flex:0 0 auto;width:68px;height:68px;border:4px solid var(--ink);border-radius:18px;background:var(--cream);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.opt-tile.on{background:var(--gold);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.opt-tile svg{width:100%;height:100%}
.sw{flex:0 0 auto;width:52px;height:52px;border:4px solid var(--ink);border-radius:50%;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.sw.on{transform:translateY(2px) scale(1.08);box-shadow:0 2px 0 var(--ink)}
.namein{border:4px solid var(--ink);border-radius:16px;padding:9px 12px;font-size:21px;font-weight:900;text-align:center;width:220px;background:var(--cream);color:var(--ink);box-shadow:0 4px 0 var(--ink)}

/* ---------- play ---------- */
.play-top{width:100%;max-width:560px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bar{flex:1;height:19px;background:rgba(255,255,255,.7);border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),#c6ff8a);transition:width .35s ease;border-radius:999px}
.combo{height:24px;font-size:19px;font-weight:900;color:#fff;text-shadow:2px 2px 0 var(--ink);letter-spacing:.5px}
.combo.show{animation:pop .4s ease}
.qcard{width:100%;max-width:520px;background:var(--cream);border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:14px 12px;text-align:center;margin:2px 0 10px;position:relative}
.qcard.golden{background:linear-gradient(160deg,#fff3bf,#ffd54a);animation:shine 1.2s ease-in-out infinite alternate}
@keyframes shine{from{box-shadow:0 8px 0 var(--ink)}to{box-shadow:0 8px 0 var(--ink),0 0 26px 6px rgba(255,201,60,.9)}}
.qlabel{font-size:14px;font-weight:800;opacity:.65}
.qtext{font-size:min(12vw,50px);font-weight:900;direction:ltr;line-height:1.1}
.golden-tag{position:absolute;top:-15px;left:50%;transform:translateX(-50%) rotate(-4deg);background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 11px;font-size:13px;font-weight:900;white-space:nowrap}
.opts{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:4px solid var(--ink);border-radius:20px;background:var(--cream);color:var(--ink);font-size:min(8.5vw,32px);font-weight:900;padding:15px 6px;box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .07s,box-shadow .07s,background .15s;direction:ltr}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt.right{background:var(--green);animation:pop .4s ease}
.opt.wrong{background:var(--red);color:#fff;animation:shakeh .4s ease}
.opt.dim{opacity:.45}
.mon-row{width:100%;max-width:520px;display:flex;align-items:flex-end;justify-content:flex-end;gap:6px;margin-top:auto;padding-top:8px}

/* ---------- map ---------- */
.map{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:6px}
.node{display:flex;align-items:center;gap:11px;width:100%;max-width:400px;background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:7px 12px;box-shadow:0 6px 0 var(--ink);cursor:pointer}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.node.locked{opacity:.5;filter:saturate(.35)}
.node.left{align-self:flex-start}.node.right{align-self:flex-end}
.node .orb{width:50px;height:50px;flex:0 0 auto;border-radius:50%;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:25px;background:var(--gold)}
.node .nm{font-size:17px;font-weight:900;line-height:1.15}
.node .sub{font-size:13px;font-weight:700;opacity:.7}
.node .stars{font-size:14px}
.connector{width:5px;height:13px;background:var(--ink);opacity:.3;border-radius:4px}

/* ---------- shop / food ---------- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;width:100%;max-width:520px;margin-top:6px}
.item{background:var(--cream);border:4px solid var(--ink);border-radius:18px;padding:6px 3px;text-align:center;box-shadow:0 5px 0 var(--ink);cursor:pointer;position:relative}
.item:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.item.on{background:var(--gold)}
.item.have{background:#dff7e6}
.item .ic{font-size:31px;line-height:1.15;height:38px;display:flex;align-items:center;justify-content:center}
.item .ic svg{width:44px;height:44px}
.item .n{font-size:12px;font-weight:800;line-height:1.1;min-height:26px}
.item .p{font-size:13px;font-weight:900;margin-top:2px}
.item.cant{opacity:.62}
.saveup{height:6px;background:#e6e0d5;border-radius:4px;overflow:hidden;margin-top:3px}
.saveup i{display:block;height:100%;background:var(--pink)}
.tabsrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}

/* ---------- mastery / parent ---------- */
.mgrid{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;width:100%;max-width:430px;margin:8px 0}
.mcell{aspect-ratio:1;border-radius:5px;background:#e9e3d8;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#8b8378;border:2px solid rgba(44,28,70,.13)}
.mcell.h{background:transparent;color:var(--cream);font-size:11px;text-shadow:1px 1px 0 var(--ink);border:none}
.mcell.l1{background:#ffe08a;color:#6a4a00}.mcell.l2{background:#8ddfa8;color:#0d4d26}.mcell.l3{background:#39d98a;color:#0d4d26}
.mcell.bad{background:#ffb3b3;color:#7a1f1f}
.statline{display:flex;justify-content:space-between;width:100%;max-width:430px;font-size:17px;font-weight:800;padding:5px 3px;border-bottom:2px dashed rgba(44,28,70,.2)}
.code{width:100%;max-width:430px;height:80px;font-size:11px;border:3px solid var(--ink);border-radius:12px;padding:7px;font-family:monospace}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(44,28,70,.55)}
.modal.show{display:flex}
.modal-card{background:var(--cream);border:5px solid var(--ink);border-radius:26px;box-shadow:0 9px 0 var(--ink);padding:16px 14px;max-width:520px;width:100%;text-align:center;animation:zoomin .3s cubic-bezier(.2,1.4,.5,1);max-height:94vh;overflow-y:auto}
@keyframes zoomin{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.modal h2{font-size:27px;margin:2px 0 6px;font-weight:900}
.modal p{font-size:18px;font-weight:700;margin:5px 0}
.reward-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.reward{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:8px 14px;font-size:21px;font-weight:900;box-shadow:0 5px 0 var(--ink)}
.chest{font-size:88px;cursor:pointer;animation:wiggle 1s ease-in-out infinite;display:inline-block}
@keyframes wiggle{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.07)}}
.dots{display:flex;flex-direction:column;gap:6px;align-items:center;margin:10px 0}
.dot-row{display:flex;gap:6px}
.dot{width:20px;height:20px;border-radius:50%;background:var(--pink);border:3px solid var(--ink);animation:zoomin .25s ease both}
.mystery{display:flex;gap:12px;justify-content:center;margin:12px 0}
.box{font-size:58px;cursor:pointer;display:inline-block}
.box.jiggle{animation:wiggle 1.4s ease-in-out infinite}

/* ---------- minigames ---------- */
.mini-head{font-size:22px;font-weight:900}
.mini-target{font-size:42px;font-weight:900;direction:ltr}
.timer{height:14px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden;margin:8px 0}
.timer-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .2s linear}
.bubble-field{position:relative;height:min(52vh,360px);min-height:270px;width:100%;overflow:visible;border:4px dashed var(--ink);border-radius:20px;background:rgba(255,255,255,.5)}
.bub{position:absolute;width:74px;height:74px;border-radius:50%;border:4px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;
  cursor:pointer;direction:ltr;touch-action:manipulation;user-select:none;
  animation:bubfloat 3.6s ease-in-out infinite;will-change:transform}
@keyframes bubfloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-11px) rotate(2deg)}}
.bub.bubble{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.98),rgba(180,235,255,.72) 55%,rgba(120,205,245,.75));
  box-shadow:inset -7px -9px 14px rgba(44,28,70,.13), inset 6px 7px 10px rgba(255,255,255,.9)}
.bub.bubble::before{content:"";position:absolute;top:11px;left:14px;width:16px;height:12px;border-radius:50%;background:rgba(255,255,255,.95);transform:rotate(-25deg)}
.bub.balloon{border-radius:49% 49% 46% 46% / 42% 42% 58% 58%;box-shadow:inset -8px -9px 12px rgba(44,28,70,.16), inset 7px 7px 10px rgba(255,255,255,.5)}
.bub.balloon::before{content:"";position:absolute;top:12px;left:15px;width:14px;height:19px;border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(-20deg)}
.bub.balloon::after{content:"";position:absolute;bottom:-30px;left:50%;width:3px;height:30px;margin-left:-1.5px;
  background:linear-gradient(var(--ink),rgba(44,28,70,.25));border-radius:2px}
.bub .knot{position:absolute;bottom:-9px;left:50%;margin-left:-6px;width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid currentColor;filter:brightness(.85)}
.bub.gone{pointer-events:none;animation:none}
.bub.popB{animation:popbub .34s cubic-bezier(.3,1.4,.6,1) forwards}
.bub.popL{animation:popbal .3s ease-out forwards}
@keyframes popbub{0%{transform:scale(1);opacity:1}45%{transform:scale(1.4);opacity:.55}100%{transform:scale(1.75);opacity:0}}
@keyframes popbal{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.32) rotate(-9deg);opacity:.9}100%{transform:scale(.15) rotate(22deg);opacity:0}}
.bub.nope{animation:shakeh .35s ease}
.shard{position:fixed;z-index:64;font-size:20px;pointer-events:none;animation:puff .7s ease-out forwards}
.tf-q{font-size:min(10vw,38px);font-weight:900;margin:10px 0;direction:ltr}
.tf-row{display:flex;gap:12px;justify-content:center}
.tf-btn{font-size:36px;width:92px;height:68px;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);cursor:pointer}
.tf-btn.yes{background:var(--green)}.tf-btn.no{background:var(--red)}
.tf-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.lyric-box{font-size:23px;font-weight:900;line-height:1.45;margin:10px 0;padding:12px;
  background:#fff3bf;border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.songrow{display:flex;align-items:center;gap:8px;width:100%;max-width:430px;text-align:left}
.lyric{font-size:24px;font-weight:900;line-height:1.5;margin:10px 0;min-height:70px}
.lyric span{display:inline-block;margin:0 3px;opacity:.35;transition:opacity .12s}
.lyric span.on{opacity:1;color:var(--pink);animation:pop .3s ease}
.micbtn{width:104px;height:104px;border-radius:50%;border:5px solid var(--ink);background:var(--pink);color:#fff;font-size:44px;box-shadow:0 7px 0 var(--ink);cursor:pointer;margin:8px}
.micbtn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.micbtn.rec{background:var(--red);animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.coinfly{position:fixed;z-index:65;font-size:24px;pointer-events:none;animation:fly .9s ease-in forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(0,-24px) scale(1.15)}100%{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
.hearts{font-size:20px;letter-spacing:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
html[dir="rtl"] .bubble::after{right:auto;left:-15px;border-left-color:transparent;border-right-color:var(--ink)}
html[dir="rtl"] .mon-row{flex-direction:row-reverse;justify-content:flex-start}
</style>
</head>
<body>
<div id="bg"><div class="sun"></div><div class="far"></div><div class="near"></div><div class="ground"></div></div>
<div id="zoo"></div>
<canvas id="fx"></canvas>
<div id="app">
  <section id="profiles" class="screen active">
    <h1 class="title" id="tGame">Monster Math Quest</h1>
    <div class="sub-title" id="tWho">Who is playing?</div>
    <div id="plist" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
    <button class="btn green" id="btnNewPlayer">+</button>
    <div style="height:10px"></div>
    <div class="row"><button class="icon-btn" id="btnLang2">עב</button><button class="icon-btn" id="btnParent">👨‍👩‍👧</button></div>
  </section>

  <section id="builder" class="screen">
    <div class="sub-title" id="tBuild">Build your monster!</div>
    <div class="stage"><div class="mon-wrap mw-big" id="bStage"></div></div>
    <div class="row"><input class="namein" id="monName" maxlength="12" placeholder="Name"><button class="icon-btn" id="btnDice">🎲</button></div>
    <div class="tabs" id="bTabs"></div>
    <div class="strip" id="bStrip"></div>
    <button class="btn green" id="btnDone">✔</button>
    <div style="height:14px"></div>

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex, p){
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = clamp(Math.round(r + 255*p*(p>0?1:0) + r*p*(p<0?1:0)),0,255);
  g = clamp(Math.round(g + 255*p*(p>0?1:0) + g*p*(p<0?1:0)),0,255);
  b = clamp(Math.round(b + 255*p*(p>0?1:0) + b*p*(p<0?1:0)),0,255);
  return "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function lerpHex(h1,h2,t){
  const a = parseInt(h1.slice(1),16), b = parseInt(h2.slice(1),16);
  const r = Math.round(((a>>16)&255)*(1-t) + ((b>>16)&255)*t);
  const g = Math.round(((a>>8)&255)*(1-t) + ((b>>8)&255)*t);
  const c = Math.round((a&255)*(1-t) + (b&255)*t);
  return "#" + ((1<<24)+(r<<16)+(g<<8)+c).toString(16).slice(1);
}

   return `<path d="M${x-18} ${y-2} Q${x} ${y+10} ${x+18} ${y-2}" fill="none" stroke="${c.ink}" stroke-width="4.5" stroke-linecap="round"/>`+fang}},

let actx = null;
function audioOn(){
  if(!DB.sound) return false;
  try{ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
       if(actx.state === "suspended") actx.resume(); return true; }catch(e){ return false; }
}
function tone(f, st, dur, type, vol){
  if(!audioOn()) return;
  const t0 = actx.currentTime + st, o = actx.createOscillator(), g = actx.createGain();
  o.type = type||"sine"; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol===undefined?.17:vol, t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+.02);
}
function slide(f1,f2,st,dur,type,vol){
  if(!audioOn()) return;
  const t0 = actx.currentTime + st, o = actx.createOscillator(), g = actx.createGain();
  o.type = type||"sine"; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0+dur);
  g.gain.setValueAtTime(vol===undefined?.14:vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+.02);
}
function noise(t0, dur, freq, q, vol, ftype){
  if(!audioOn()) return;
  const n = Math.max(1, Math.ceil(actx.sampleRate*dur));
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const dat = buf.getChannelData(0);
  for(let i=0;i<n;i++) dat[i] = Math.random()*2 - 1;
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter();
  f.type = ftype || "bandpass"; f.frequency.setValueAtTime(freq, t0); f.Q.value = q || 1;
  const g = actx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0 + dur + 0.02);
}

/* ---------------- fx ---------------- */
const fxc = document.getElementById("fx"), ctx = fxc.getContext("2d");
let parts = [], rafOn = false;
function sizeCanvas(){ fxc.width = innerWidth; fxc.height = innerHeight; }
addEventListener("resize", sizeCanvas); sizeCanvas();
const CONF = ["#ff6392","#ffc93c","#39d98a","#6ec8ff","#c084fc","#fff"];
function confetti(x,y,n,cols){
  const pal = cols || CONF;
  for(let i=0;i<(n||30);i++) parts.push({x:x,y:y,vx:(Math.random()-.5)*11,vy:-Math.random()*13-3,
    w:5+Math.random()*8,h:5+Math.random()*9,c:pick(pal),rot:Math.random()*6,vr:(Math.random()-.5)*.35,life:66+Math.random()*40});
  if(!rafOn){ rafOn = true; requestAnimationFrame(stepFx); }
}
function stepFx(){
  ctx.clearRect(0,0,fxc.width,fxc.height);
  parts = parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.vy += .42; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
  if(parts.length) requestAnimationFrame(stepFx); else { rafOn = false; ctx.clearRect(0,0,fxc.width,fxc.height); }
}
function coinFly(fromEl, n, targetId){
  if(!fromEl) return;
  const r = fromEl.getBoundingClientRect();
  const tEl = document.getElementById(targetId || (document.getElementById("play").classList.contains("active") ? "chipPlayCoins" : "chipCoins"));
  if(!tEl) return;
  const t = tEl.getBoundingClientRect();
  for(let i=0;i<Math.min(n,8);i++){
    const c = document.createElement("div");
    c.className = "coinfly"; c.textContent = "🪙";
    c.style.left = (r.left + r.width/2 + (Math.random()-.5)*46) + "px";
    c.style.top = (r.top + r.height/2) + "px";
    c.style.setProperty("--dx", (t.left - r.left) + "px");
    c.style.setProperty("--dy", (t.top - r.top) + "px");
    c.style.animationDelay = (i*.06) + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 1100 + i*60);
  }
}

function colorsOf(av){
  const skin = SKINS[av.skin] || SKINS[0];
  return {skin:skin, dark:shade(skin,-.24), light:shade(skin,.34), hair:HAIRC[av.hairc] || HAIRC[0], ink:"#2c1c46"};
}
function monSVG(av, opt){
  opt = opt || {};
  const b = BODIES[av.body] || BODIES[0], c = colorsOf(av), x = 100;
  const eq = opt.eq || {head:"",eyes:"",neck:"",wrist:"",back:""};
  const A = id => ACC.find(a=>a.id===id);
  const bw = 132, neckY = b.mouthY + 26;
  const wl = [x - b.armDX - 9, b.armY + 22], wr = [x + b.armDX + 9, b.armY + 22];
  let s = '<svg class="mon" viewBox="0 -36 200 242" xmlns="http://www.w3.org/2000/svg">';
  s += `<ellipse cx="100" cy="190" rx="46" ry="6" fill="rgba(44,28,70,.15)"/>`;
  s += '<g class="mbody">';
  if(eq.back && A(eq.back)) s += A(eq.back).f(x, b.armY - 20, bw, c);
  const armL = `M${x-b.armDX+6} ${b.armY-6} q-20 10 -15 28`, armR = `M${x+b.armDX-6} ${b.armY-6} q20 10 15 28`;
  s += `<path d="${armL}" fill="none" stroke="${c.ink}" stroke-width="21" stroke-linecap="round"/>`;
  s += `<path d="${armR}" fill="none" stroke="${c.ink}" stroke-width="21" stroke-linecap="round"/>`;
  s += `<path d="${armL}" fill="none" stroke="${c.skin}" stroke-width="14" stroke-linecap="round"/>`;
  s += `<path d="${armR}" fill="none" stroke="${c.skin}" stroke-width="14" stroke-linecap="round"/>`;
  if(b.footDX){
    s += `<ellipse cx="${x-b.footDX}" cy="${b.footY}" rx="21" ry="11" fill="${c.dark}" stroke="${c.ink}" stroke-width="4"/>`;
    s += `<ellipse cx="${x+b.footDX}" cy="${b.footY}" rx="21" ry="11" fill="${c.dark}" stroke="${c.ink}" stroke-width="4"/>`;
  }
  s += `<path d="${b.d}" fill="${c.skin}" stroke="${c.ink}" stroke-width="5" stroke-linejoin="round"/>`;
  s += (PATTERNS[av.pat] || PATTERNS[0]).f(b, c);
  s += '<g class="eyes">' + (EYES[av.eyes] || EYES[0]).f(x, b.eyeY, b.eyeDX, c) + '</g>';
  s += (NOSES[av.nose] || NOSES[0]).f(x, b.noseY, c);
  s += '<g class="mouthg">' + (MOUTHS[av.mouth] || MOUTHS[0]).f(x, b.mouthY, opt.mouth || "idle", c) + '</g>';
  s += (HAIRS[av.hair] || HAIRS[0]).f(x, b.topY, c);
  if(eq.neck && A(eq.neck)) s += A(eq.neck).f(x, neckY, bw, c);
  if(eq.head && A(eq.head)) s += A(eq.head).f(x, b.topY, c);
  if(eq.eyes && A(eq.eyes)) s += A(eq.eyes).f(x, b.eyeY, b.eyeDX, c);
  if(eq.wrist && A(eq.wrist)) s += A(eq.wrist).f(wl[0], wl[1], c) + A(eq.wrist).f(wr[0], wr[1], c);
  s += '</g></svg>';
  return s;
}
function mountMon(id, av, opt){
  const el = document.getElementById(id);
  if(!el) return null;
  el.innerHTML = monSVG(av || (P && P.av), opt || {eq: P && P.eq});
  return el;
}
function setMouth(id, state){
  const el = document.getElementById(id); if(!el) return;
  const g = el.querySelector(".mouthg"); if(!g) return;
  const av = (P && P.av) || {}, b = BODIES[av.body] || BODIES[0], c = colorsOf(av);
  g.innerHTML = (MOUTHS[av.mouth] || MOUTHS[0]).f(100, b.mouthY, state, c);
}
function setMood(id, mood){
  const el = document.getElementById(id); if(!el) return;
  const svg = el.querySelector(".mon"); if(!svg) return;
  setMouth(id, mood === "oops" ? "oops" : (mood === "idle" ? "idle" : "happy"));
  svg.classList.remove("happy","oops");
  if(mood === "happy" || mood === "wow"){ svg.getBoundingClientRect(); svg.classList.add("happy"); }
  if(mood === "oops"){ svg.getBoundingClientRect(); svg.classList.add("oops"); }
  if(mood !== "idle") setTimeout(()=>{ if(svg.isConnected){ svg.classList.remove("happy","oops"); setMouth(id,"idle"); } }, 1500);
}
let typeTimer = null;
function say(id, text, voice){
  const el = document.getElementById(id); if(!el) return;
  clearTimeout(typeTimer); el.textContent = "";
  let i = 0;
  if(voice !== false) SFX.voice(Math.min(5, Math.ceil(text.length/9)));
  (function tick(){ el.textContent = text.slice(0, ++i); if(i < text.length) typeTimer = setTimeout(tick, 20); })();
}

/* ---------------- critters ---------------- */
const CRIT_SOUND = {
 bird:["🦜","🦆","🕊️","🦅","🦉","🐦","🐣","🦢","🦩"],
 squeak:["🐁","🐹","🐰","🐇","🐿️","🦔","🐈","🦝","🐀"],
 roar:["🦖","🦕","🐉","🐲","🐻","🐺","🦈","🐊","🦧","🐻‍❄️","🦂"],
 buzz:["🐝","🦟","🐛","🐞","🦋"],
 splash:["🐠","🐡","🐙","🦀","🐢","🦞","🦭","🐸"],
 robot:["👾","🛸","🤖","👽","🚀","🛰️","🪐","🌟","🧚","🦄","☁️","⛄","🍬","🔥"]
};
function critSound(e){
  let kind = "squeak";
  for(const k in CRIT_SOUND) if(CRIT_SOUND[k].indexOf(e) >= 0){ kind = k; break; }
  if(kind === "bird"){ tone(1200,0,.07,"sine",.11); tone(1600,.07,.09,"sine",.1); tone(1350,.16,.07,"sine",.08); }
  else if(kind === "roar"){ slide(180,70,0,.42,"sawtooth",.15); tone(90,.05,.3,"square",.07); }
  else if(kind === "buzz"){ slide(420,380,0,.3,"sawtooth",.08); }
  else if(kind === "splash"){ slide(900,200,0,.22,"sine",.13); tone(1400,.16,.1,"sine",.07); }
  else if(kind === "robot"){ tone(880,0,.06,"square",.09); tone(1320,.06,.06,"square",.08); tone(660,.13,.09,"square",.08); }
  else { tone(980,0,.06,"triangle",.12); tone(1240,.06,.08,"triangle",.1); }
}
const PUFFS = ["❤️","✨","🎵","💫","⭐","😂","🎉"];
let zooDrops = 0;
function puffAt(x, y, txt){
  const d = document.createElement("div");
  d.className = "puff"; d.textContent = txt;
  d.style.left = x + "px"; d.style.top = y + "px";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 950);
}
function spawnCritter(w, i){
  const zoo = document.getElementById("zoo");
  if(!zoo) return;
  const e = pick(w.crit);
  const el = document.createElement("div");
  el.className = "critter";
  el.innerHTML = "<i>" + e + "</i>";
  const size = 28 + Math.floor(Math.random()*16);
  el.style.fontSize = size + "px";
  el.style.top = (w.cy - 6 + Math.random()*8) + "%";
  el.style.animationDuration = (15 + Math.random()*13) + "s";
  el.style.animationDelay = (-Math.random()*14) + "s";
  el.dataset.taps = "0";
  el.onclick = ev=>{
    ev.stopPropagation();
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top;
    critSound(e);
    el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit");
    puffAt(cx, cy, pick(PUFFS));
    const n = (+el.dataset.taps) + 1;
    el.dataset.taps = n;
    if(n >= 3){
      if(zooDrops < 5 && P){
        zooDrops++;
        const gain = 2 + Math.floor(Math.random()*3);
        P.coins += gain;
        if(G) { G.coins += gain; const pc = document.getElementById("playCoins"); if(pc) pc.textContent = G.coins; }
        refreshHUDSafe();
        SFX.coin(); coinFly(el, 3);
        puffAt(cx, cy + 18, "+" + gain + "🪙");
        confetti(cx, cy, 18, ["#ffc93c","#fff3bf"]);
        save();
      } else { puffAt(cx, cy + 18, "💨"); }
      el.classList.add("flee");
      setTimeout(()=>{ el.remove(); if(sceneWorld >= 0) spawnCritter(WORLDS[sceneWorld], i); }, 2700);
    }
  };
  zoo.appendChild(el);
}
function refreshHUDSafe(){
  const a = document.getElementById("hudCoins"); if(a && P) a.textContent = P.coins;
  const b = document.getElementById("hudGems"); if(b && P) b.textContent = P.gems;
}

/* ---------------- scenery ---------------- */
let sceneWorld = -1;
function applyScene(wi, prog){
  const w = WORLDS[wi] || WORLDS[0];
  const t = clamp(prog || 0, 0, 1) * .8;
  const bg = document.getElementById("bg");
  const st = document.documentElement.style;
  st.setProperty("--sky1", lerpHex(w.sky[0], w.set[0], t));
  st.setProperty("--sky2", lerpHex(w.sky[1], w.set[1], t));
  st.setProperty("--far", w.far); st.setProperty("--near", w.near); st.setProperty("--ground", w.ground);
  bg.style.background = "linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 62%)";
  const sun = bg.querySelector(".sun");
  sun.style.top = (8 + t*52) + "%";
  sun.style.background = t > .35 ? "rgba(255,214,150,.9)" : "rgba(255,255,255,.75)";
  if(sceneWorld === wi) return;
  sceneWorld = wi;
  zooDrops = 0;
  [...bg.querySelectorAll(".prop")].forEach(e=>e.remove());
  const zoo = document.getElementById("zoo");
  if(zoo) zoo.innerHTML = "";
  w.props.forEach((p,i)=>{
    const d = document.createElement("div");
    d.className = "prop" + (i % 3 === 1 ? " bob" : "");
    d.textContent = p[0];
    d.style.left = p[1] + "%"; d.style.top = p[2] + "%"; d.style.fontSize = p[3] + "px";
    d.style.animationDelay = (-i*0.7) + "s";
    bg.appendChild(d);
  });
  for(let i=0;i<3;i++) spawnCritter(w, i);
}

/* ---------------- questions ---------------- */
function weightedOp(ops){
  const r = Math.random(); let acc = 0;
  for(const k in ops){ acc += ops[k]; if(r <= acc) return k; }
  return "mul";
}
function mastOf(a,b){ const m = P.mast[a+"x"+b]; return m || {c:0,w:0}; }
function pickFact(tabs, list){
  const pairs = [];
  if(list) list.forEach(f=>pairs.push([f[0], f[1]]));
  else (tabs || [2]).forEach(a=>{ for(let b=1;b<=10;b++) pairs.push([a,b]); });
  const pool = []; let total = 0;
  pairs.forEach(pr=>{
    const a = pr[0], b = pr[1];
    if(G && G.lastKey === a+"x"+b) return;
    const m = mastOf(a,b);
    const wgt = 1 + 2.5*Math.max(0, m.w - m.c*0.4) + (m.c === 0 ? 0.6 : 0);
    pool.push({a:a,b:b,w:wgt}); total += wgt;
  });
  if(!pool.length) return {a:pairs[0][0], b:pairs[0][1]};
  let r = Math.random()*total;
  for(const p of pool){ r -= p.w; if(r <= 0) return p; }
  return pool[0];
}
/* derived-fact hint: the strategy a teacher would show, not just the answer */
function hintFor(a, b){
  const he = LANG === "he";
  const big = Math.max(a,b), sm = Math.min(a,b), p = a*b;
  if(big === 10 || sm === 10) return he ? "כפול 10 זה פשוט להוסיף 0 בסוף." : "Times 10 just puts a 0 on the end.";
  if(a === b) return he ? ("זה ריבוע: " + a + " שורות של " + a + ".") : ("It's a square: " + a + " rows of " + a + ".");
  if(big === 9 || sm === 9){ const o = big === 9 ? sm : big;
    return he ? ("10×" + o + " = " + (10*o) + ", פחות " + o + " = " + p + ".") : ("10×" + o + " = " + (10*o) + ", take away " + o + " → " + p + "."); }
  if(big === 5 || sm === 5){ const o = big === 5 ? sm : big;
    return he ? ("חצי מ-10×" + o + " = " + (10*o) + ", כלומר " + p + ".") : ("Half of 10×" + o + " = " + (10*o) + ", so " + p + "."); }
  if(big === 4 || sm === 4){ const o = big === 4 ? sm : big;
    return he ? ("כפילו פעמיים: 2×" + o + " = " + (2*o) + ", ושוב = " + p + ".") : ("Double twice: 2×" + o + " = " + (2*o) + ", double again → " + p + "."); }
  if(big === 8 || sm === 8){ const o = big === 8 ? sm : big;
    return he ? ("4×" + o + " = " + (4*o) + ", כפול 2 = " + p + ".") : ("4×" + o + " = " + (4*o) + ", double it → " + p + "."); }
  if(big === 6 || sm === 6){ const o = big === 6 ? sm : big;
    return he ? ("5×" + o + " = " + (5*o) + ", ועוד " + o + " = " + p + ".") : ("5×" + o + " = " + (5*o) + ", plus one more " + o + " → " + p + "."); }
  if(big === 3 || sm === 3){ const o = big === 3 ? sm : big;
    return he ? ("2×" + o + " = " + (2*o) + ", ועוד " + o + " = " + p + ".") : ("2×" + o + " = " + (2*o) + ", plus one more " + o + " → " + p + "."); }
  if(big === 7 || sm === 7){ const o = big === 7 ? sm : big;
    return he ? ("5×" + o + " = " + (5*o) + ", ועוד 2×" + o + " = " + (2*o) + ", ביחד " + p + ".") : ("5×" + o + " = " + (5*o) + " and 2×" + o + " = " + (2*o) + ", together " + p + "."); }
  if(big === 2 || sm === 2){ const o = big === 2 ? sm : big;
    return he ? ("פשוט כפילו: " + o + " ועוד " + o + " = " + p + ".") : ("Just double it: " + o + " + " + o + " = " + p + "."); }
  return "";
}
function distract(ans, a, b, op){
  const cand = op === "mul" ? [a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+10,ans+2]
                            : [ans+1,ans-1,ans+2,ans-2,ans+3,ans-3,ans+10,ans-10];
  const out = [];
  for(const c of cand.sort(()=>Math.random()-.5)){
    if(c > 0 && c !== ans && out.indexOf(c) < 0) out.push(c);
    if(out.length === 3) break;
  }
  let k = 1;
  while(out.length < 3){ const c = ans + k; if(c > 0 && c !== ans && out.indexOf(c) < 0) out.push(c); k++; }
  return out;
}
function makeQuestion(w, forceMul){
  const op = forceMul ? "mul" : weightedOp(w.ops);
  /* spaced interleaved review: some questions come from earlier tables */
  let tabs = w.tables, list = w.facts;
  if(w.review && w.rev && Math.random() < w.review){ tabs = w.rev; list = null; }
  let q;
  if(op === "div"){
    const f = pickFact(tabs, list); if(G) G.lastKey = f.a+"x"+f.b;
    const c = f.a*f.b;
    q = {label:T("solve"), text:c+" ÷ "+f.a, ans:f.b, a:f.a, b:f.b, op:"div", key:f.a+"x"+f.b,
         choices:distract(f.b, f.a, f.b, "add").concat([f.b])};
  } else if(op === "mul"){
    const f = pickFact(tabs, list); if(G) G.lastKey = f.a+"x"+f.b;
    const ans = f.a*f.b;
    if(!forceMul && w.missing && Math.random() < w.missing){
      q = {label:T("missing"), text:f.a+" × ? = "+ans, ans:f.b, a:f.a, b:f.b, op:"mul", key:f.a+"x"+f.b,
           choices:distract(f.b, f.a, f.b, "add").concat([f.b])};
    } else {
      q = {label:T("solve"), text:f.a+" × "+f.b, ans:ans, a:f.a, b:f.b, op:"mul", key:f.a+"x"+f.b,
           choices:distract(ans, f.a, f.b, "mul").concat([ans])};
    }
  } else if(op === "add"){
    const a = 11 + Math.floor(Math.random()*38), b = 4 + Math.floor(Math.random()*16);
    q = {label:T("solve"), text:a+" + "+b, ans:a+b, a:a, b:b, op:"add", key:null, choices:distract(a+b,a,b,"add").concat([a+b])};
  } else {
    const a = 22 + Math.floor(Math.random()*38), b = 3 + Math.floor(Math.random()*17);
    q = {label:T("solve"), text:a+" − "+b, ans:a-b, a:a, b:b, op:"sub", key:null, choices:distract(a-b,a,b,"sub").concat([a-b])};
  }
  q.choices.sort(()=>Math.random()-.5);
  return q;
}

/* ---------------- play ---------------- */
function gemUp(){ P.gems++; }
function buff(name){ if(!P.buff) return false; const f = FOOD.find(x=>x.id === P.buff); return f && f.bonus === name; }
function startWorld(i){
  const w = WORLDS[i];
  G = {wi:i, w:w, qIndex:0, total:QPW, correct:0, coins:0, gems:0, streak:0, comboLeft:0,
       lastKey:null, minis:0, busy:false, t0:Date.now(), shield:buff("shield"), tower:false, streakGems:0, song1:false, song2:false};
  applyScene(i, 0);
  mountMon("playMon", P.av, {eq:P.eq});
  document.getElementById("playCoins").textContent = 0;
  document.getElementById("comboTag").textContent = "";
  show("play");
  say("playBubble", P.name + "!", false);
  updateBar();
  setTimeout(nextStep, 250);
}
function startTower(){
  G = {wi:WORLDS.length-1, w:WORLDS[WORLDS.length-1], qIndex:0, total:9999, correct:0, coins:0, gems:0,
       streak:0, comboLeft:0, lastKey:null, minis:99, busy:false, t0:Date.now(), shield:false, tower:true, lives:3, streakGems:0};
  applyScene(WORLDS.length-1, 0);
  mountMon("playMon", P.av, {eq:P.eq});
  document.getElementById("playCoins").textContent = 0;
  show("play");
  say("playBubble", T("tower"), false);
  askQuestion();
}
function updateBar(){
  if(G.tower){
    document.getElementById("barFill").style.width = "100%";
    document.getElementById("comboTag").textContent = "❤️".repeat(G.lives) + "  " + G.correct;
    return;
  }
  const p = G.qIndex / G.total;
  document.getElementById("barFill").style.width = (100*p) + "%";
  applyScene(G.wi, p);
}
function nextStep(){
  if(!G) return;
  if(!G.tower && G.qIndex >= G.total) return finishWorld();
  if(!G.tower && G.qIndex === 3 && !G.song1){
    G.song1 = true;
    const f = pickFact((G.w.tables && G.w.tables.length) ? G.w.tables : null, G.w.facts);
    return recordBreak({mode:"words", a:f.a, b:f.b}, nextStep);
  }
  if(!G.tower && G.qIndex === 7 && !G.song2){
    G.song2 = true;
    const f = pickFact((G.w.tables && G.w.tables.length) ? G.w.tables : null, G.w.facts);
    return recordBreak({mode:"free", a:f.a, b:f.b}, nextStep);
  }
  if(!G.tower && ((G.qIndex === 4 && G.minis === 0) || (G.qIndex === 8 && G.minis === 1))){
    G.minis++;
    const which = (G.wi + G.minis) % 3;
    if(which === 0) return miniBubbles(nextStep);
    if(which === 1) return miniTrueFalse(nextStep);
    return askSpeed(nextStep);
  }
  askQuestion();
}
function askQuestion(){
  const q = makeQuestion(G.w);
  q.golden = Math.random() < (buff("golden") ? .26 : .13);
  G.q = q; G.busy = false;
  const card = document.getElementById("qcard");
  card.classList.toggle("golden", q.golden);
  card.querySelectorAll(".golden-tag").forEach(e=>e.remove());
  if(q.golden){
    const tag = document.createElement("div");
    tag.className = "golden-tag"; tag.textContent = T("golden");
    card.appendChild(tag); SFX.gem();
  }
  document.getElementById("qlabel").textContent = q.label;
  const qt = document.getElementById("qtext");
  qt.textContent = q.text;
  qt.style.fontSize = q.text.length > 7 ? "min(8.5vw,40px)" : "min(12vw,50px)";
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  q.choices.forEach(v=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = v;
    b.onclick = ()=>answer(b, v);
    opts.appendChild(b);
  });
}
function trackMastery(key, ok){
  if(!key) return;
  const m = P.mast[key] || {c:0,w:0};
  if(ok) m.c++; else m.w++;
  P.mast[key] = m;
  /* turnaround facts: 3x7 and 7x3 are the same fact, so credit both */
  const pr = key.split("x");
  if(pr.length === 2 && pr[0] !== pr[1]){
    const mk = pr[1] + "x" + pr[0], mm = P.mast[mk] || {c:0,w:0};
    if(ok) mm.c += 0.5; else mm.w += 0.5;
    P.mast[mk] = mm;
  }
}
function answer(btn, val){
  if(!G || G.busy) return;
  G.busy = true;
  const q = G.q, opts = [...document.getElementById("opts").children];
  P.stats.ans++;
  if(val === q.ans){
    P.stats.ok++;
    trackMastery(q.key, true);
    btn.classList.add("right");
    opts.forEach(o=>{ if(o !== btn) o.classList.add("dim"); });
    SFX.correct();
    G.correct++; G.streak++;
    let coins = 3 + Math.min(G.streak, 5);
    if(buff("plus2")) coins += 2;
    if(buff("fast3") && G.qIndex < 3) coins *= 2;
    if(G.comboLeft > 0){ coins *= 2; G.comboLeft--; }
    if(q.golden) coins *= 3;
    if(buff("coins10")) coins = Math.round(coins*1.1);
    G.coins += coins; P.coins += coins;
    document.getElementById("playCoins").textContent = G.coins;
    bump("chipPlayCoins");
    coinFly(btn, Math.ceil(coins/6));
    setTimeout(()=>SFX.coin(), 240);
    const r = btn.getBoundingClientRect();
    confetti(r.left + r.width/2, r.top + r.height/2, q.golden ? 55 : 24);
    setMood("playMon", q.golden ? "wow" : "happy");
    say("playBubble", pick(T("praise")));
    dailyTick();
    let extra = 0;
    const tag = document.getElementById("comboTag");
    if(!G.tower && G.streak === 3){
      G.comboLeft = buff("combo") ? 5 : 3; tag.textContent = T("combo");
      tag.classList.remove("show"); void tag.offsetWidth; tag.classList.add("show"); SFX.levelup(); extra = 350;
    }
    if(!G.tower && G.streak % 5 === 0 && G.streakGems < 2){
      G.streakGems++; gemUp(); G.gems++; tag.textContent = T("onFire");
      tag.classList.remove("show"); void tag.offsetWidth; tag.classList.add("show");
      SFX.gem(); confetti(innerWidth/2, innerHeight/3, 55); extra = 550;
    }
    G.qIndex++; updateBar(); save();
    if(!G.tower && Math.random() < (buff("mystery") ? .26 : .13) && G.qIndex < G.total) setTimeout(mysteryBoxes, 800 + extra);
    else setTimeout(nextStep, 820 + extra);
  } else {
    trackMastery(q.key, false);
    btn.classList.add("wrong");
    opts.forEach(o=>{ if(+o.textContent === q.ans) o.classList.add("right"); });
    SFX.wrong();
    let forgiven = false;
    if(G.shield){ G.shield = false; forgiven = true; }
    else { G.streak = 0; G.comboLeft = 0; if(!G.tower) document.getElementById("comboTag").textContent = ""; }
    if(G.tower){
      G.lives--;
      if(G.lives <= 0){ setTimeout(towerOver, 900); updateBar(); return; }
    }
    setMood("playMon", "oops");
    say("playBubble", forgiven ? "🛡️ " + pick(T("praise")) : pick(T("oops")));
    G.qIndex++; updateBar(); save();
    setTimeout(()=>explain(q), 900);
  }
}
function dailyTick(){
  if(P.stats.day !== today()){ P.stats.day = today(); P.stats.dayCount = 0; }
  P.stats.dayCount++;
  if(P.stats.dayCount === 20){
    P.coins += 30; P.gems++;
    SFX.fanfare(); confetti(innerWidth/2, innerHeight/2.5, 60);
    setTimeout(()=>say("playBubble", T("dailyDone")), 1200);
  }
}
function explain(q){
  let body = "";
  if((q.op === "mul" || q.op === "div") && q.a <= 10 && q.b <= 10){
    let rows = "";
    for(let i=0;i<q.a;i++){
      let row = "";
      for(let j=0;j<q.b;j++) row += '<div class="dot" style="animation-delay:'+((i*q.b+j)*.02)+'s"></div>';
      rows += '<div class="dot-row">'+row+'</div>';
    }
    body = '<p>'+ q.a +' '+ T("groupsOf") +' '+ q.b +'</p><div class="dots">'+rows+'</div>';
  }
  const eq = q.op === "mul" ? (q.a+" × "+q.b+" = "+(q.a*q.b))
           : q.op === "div" ? (q.text+" = "+q.ans) : (q.text+" = "+q.ans);
  let hint = "";
  if(q.key && (q.op === "mul" || q.op === "div")){
    const h = hintFor(q.a, q.b);
    if(h) hint += '<p style="font-size:16px;background:#fff3bf;border:3px solid var(--ink);border-radius:14px;padding:8px">💡 '+ h +'</p>';
    if(q.a !== q.b) hint += '<p style="font-size:15px;opacity:.8">🔄 '+ (LANG === "he"
      ? (q.a+" × "+q.b+" זה בדיוק כמו "+q.b+" × "+q.a)
      : (q.a+" × "+q.b+" is the same as "+q.b+" × "+q.a)) +'</p>';
  }
  modal('<h2>'+ T("correctIs") +'</h2><div class="qtext" style="font-size:34px">'+ eq +'</div>'+ hint + body
    + '<button class="btn green" id="okBtn">'+ T("tapContinue") +'</button>');
  document.getElementById("okBtn").onclick = ()=>{ closeModal(); SFX.pop(); nextStep(); };
}
function mysteryBoxes(){
  SFX.whoosh();
  const prizes = [];
  prizes.push(Math.random() < .22 ? {t:"gem"} : {t:"coins", n:6 + Math.floor(Math.random()*10)});
  prizes.push({t:"coins", n:3 + Math.floor(Math.random()*6)});
  prizes.push({t:"none"});

      else { P.coins += 3; G.coins += 3; b.textContent = "💨"; msg = T("nothing"); SFX.pop(); }

}

/* ---------------- singing ----------------
   The app supplies the words; the child supplies the tune. No generated melody,
   because a machine-timed one never lines up with how a kid actually sings it. */
function songFor(key, a, b){
  if(SONGS[key]) return {text:SONGS[key][LANG], title:"\ud83c\udfb5 " + T("songTime")};
  const n = Math.max(a, b);
  if(n >= 2 && n <= 10){
    const seq = [];
    for(let i=1;i<=10;i++) seq.push(n*i);
    return {text:seq.join("  "), title:"\ud83c\udfb5 " + T("countBy") + " " + n + "!"};
  }
  return null;
}
let micStream = null, micRec = null, micURL = null;
function micSupported(){
  try{ return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
  catch(e){ return false; }
}
function cleanupMic(){
  try{ if(micRec && micRec.state === "recording") micRec.stop(); }catch(e){}
  try{ if(micStream) micStream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ if(micURL) URL.revokeObjectURL(micURL); }catch(e){}
  micStream = null; micRec = null; micURL = null;
}
function playDataURL(url){
  try{ const au = new Audio(url); au.play().catch(()=>{}); return au; }catch(e){ return null; }
}
/* opts: {mode:"words"|"free", a, b} */
function recordBreak(opts, done){
  const a = opts.a, b = opts.b, fact = a + " \u00d7 " + b + " = " + (a*b);
  const song = opts.mode === "words" ? songFor(a+"x"+b, a, b) : null;
  const words = song ? song.text : "";
  const title = song ? song.title : ("\ud83c\udfa4 " + T("yourSong"));
  const prompt = song ? T("singAlong") : (T("yourSongHow") + " " + fact);
  SFX.whoosh();

  const finish = async (blob)=>{
    let saved = false, full = false;
    if(blob){
      try{
        const url = await blobToDataURL(blob);
        if(mySongs().length >= SONG_CAP) full = true;
        else {
          SDB.list.push({id:"s"+Date.now(), pid:P.id, who:P.name, fact:fact,
                         words:words || "", date:new Date().toISOString().slice(0,10), data:url});
          saved = await saveSongs();
          if(!saved) full = true;
        }
      }catch(e){ full = true; }
    }
    cleanupMic();
    const gain = 12;
    P.coins += gain;
    if(G){ G.coins += gain; const pc = document.getElementById("playCoins"); if(pc) pc.textContent = G.coins; }
    refreshHUDSafe(); save();
    SFX.fanfare(); confetti(innerWidth/2, innerHeight/2.3, 60);
    modal('<h2>\ud83c\udf1f '+ T("sangIt") +'</h2>'
      + '<div class="reward-row"><div class="reward">+'+gain+' \ud83e\ude99</div></div>'
      + (saved ? '<p>\ud83c\udfb5 '+ T("songSaved") +'</p>' : (full ? '<p>'+ T("full") +'</p>' : ''))
      + '<button class="btn green" id="okBtn">'+ T("nextOn") +' \u25b6</button>');
    document.getElementById("okBtn").onclick = ()=>{ closeModal(); done(); };
  };

  modal('<h2>'+ title +'</h2>'
    + '<div class="mon-wrap mw-sm" id="songMon" style="margin:0 auto"></div>'
    + '<p style="font-size:15px;font-weight:800;opacity:.75;margin:2px 0">'+ prompt +'</p>'
    + (song ? '<div class="lyric-box" id="lyric">'+ words +'</div>'
            : '<div class="qtext" style="font-size:34px">'+ fact +'</div>')
    + '<div id="micArea"></div>'
    + '<div id="micMsg" style="min-height:26px;font-size:16px;font-weight:800"></div>'
    + '<button class="btn plain sm" id="skipB">'+ T("nextOn") +' \u25b6</button>');
  mountMon("songMon", P.av, {eq:P.eq});
  document.getElementById("skipB").onclick = ()=>{ cleanupMic(); closeModal(); done(); };
  const area = document.getElementById("micArea"), msg = document.getElementById("micMsg");

  if(!micSupported()){
    msg.textContent = T("micBlocked");
    const b2 = document.createElement("button");
    b2.className = "btn pink"; b2.textContent = "\ud83c\udfa4 " + T("noMic");
    b2.onclick = ()=>{
      b2.disabled = true;
      let n = 5;
      msg.textContent = T("counting") + " " + n;
      const iv = setInterval(()=>{
        n--; tone(880, 0, .07, "square", .07);
        msg.textContent = n > 0 ? (T("recording") + " " + n) : "";
        if(n <= 0){ clearInterval(iv); finish(null); }
      }, 1000);
    };
    area.appendChild(b2);
    return;
  }
  const mic = document.createElement("button");
  mic.className = "micbtn"; mic.textContent = "\ud83c\udfa4";
  area.appendChild(mic);
  msg.textContent = T("tapMic");
  let chunks = [], stopTimer = null;
  mic.onclick = async ()=>{
    if(micRec && micRec.state === "recording"){ micRec.stop(); return; }
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks = [];
      let opt = {};
      try{ if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) opt = {mimeType:"audio/webm;codecs=opus", audioBitsPerSecond:24000}; }catch(e){}
      try{ micRec = new MediaRecorder(micStream, opt); }catch(e){ micRec = new MediaRecorder(micStream); }
      micRec.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
      micRec.onstop = ()=>{
        clearTimeout(stopTimer);
        mic.classList.remove("rec"); mic.textContent = "\ud83c\udfa4";
        try{ micStream.getTracks().forEach(t=>t.stop()); }catch(e){}
        if(!chunks.length){ msg.textContent = T("tapMic"); return; }
        const blob = new Blob(chunks, {type: chunks[0].type || "audio/webm"});
        micURL = URL.createObjectURL(blob);
        msg.textContent = "";
        area.innerHTML = "";
        const play = document.createElement("button");
        play.className = "btn"; play.textContent = "\u25b6 " + T("listen");
        play.onclick = ()=>playDataURL(micURL);
        const keep = document.createElement("button");
        keep.className = "btn green"; keep.textContent = "\ud83d\udc96 " + T("keepIt");
        keep.onclick = ()=>finish(blob);
        const retry = document.createElement("button");
        retry.className = "btn plain sm"; retry.textContent = T("retry");
        retry.onclick = ()=>{ cleanupMic(); closeModal(); recordBreak(opts, done); };
        area.appendChild(play); area.appendChild(keep);
        area.appendChild(document.createElement("br")); area.appendChild(retry);
        playDataURL(micURL);
      };
      micRec.start();
      mic.classList.add("rec"); mic.textContent = "\u23f9";
      msg.textContent = T("recording");
      stopTimer = setTimeout(()=>{ try{ if(micRec && micRec.state === "recording") micRec.stop(); }catch(e){} }, 15000);
    }catch(e){
      msg.textContent = T("micBlocked");
      mic.classList.remove("rec"); mic.textContent = "\ud83c\udfa4";
      mic.onclick = ()=>finish(null);
    }
  };
}

/* ---------------- mini games ---------------- */
/* timed drills raise anxiety for some kids, so the timer is always the player's choice */
function askSpeed(done){
  if(P.calm) return miniBubbles(done, true);
  SFX.whoosh();
  modal('<h2>🎲 '+ T("chooseGame") +'</h2>'
    + '<div class="reward-row" style="flex-direction:column;align-items:stretch">'
    + '<button class="btn pink" id="goSpeed">⚡ '+ T("speedOpt") +'<div style="font-size:14px;font-weight:700;opacity:.9">'+ T("withTimer") +'</div></button>'
    + '<button class="btn green" id="goCalm">🧩 '+ T("calmOpt") +'<div style="font-size:14px;font-weight:700;opacity:.9">'+ T("noTimer") +'</div></button>'
    + '</div>');
  document.getElementById("goSpeed").onclick = ()=>{ closeModal(); SFX.pop(); miniSpeed(done); };
  document.getElementById("goCalm").onclick = ()=>{ closeModal(); SFX.pop(); miniBubbles(done, true); };
}
function extraTime(){ return buff("slowtime") ? 5 : 0; }
function miniBubbles(done, untimed){
  const isBalloon = Math.random() < .5;
  const PAL = ["#ff6392","#ffc93c","#39d98a","#6ec8ff","#c084fc","#ff8b3d","#5ae0c8","#ff5c5c"];
  const tabs = (G.w.tables && G.w.tables.length) ? G.w.tables : [2,3,4,5,6,7,8,9];
  const a = pick(tabs), b = 2 + Math.floor(Math.random()*8), target = a*b;
  const good = [a+" × "+b];
  if(a !== b) good.push(b+" × "+a);
  for(let x=2;x<=10 && good.length<4;x++) if(target % x === 0 && target/x <= 10 && x !== a && x !== b) good.push(x+" × "+(target/x));
  while(good.length < 4){ const k = 1 + Math.floor(Math.random()*9); good.push((target-k)+" + "+k); }
  const bad = [], seen = {};
  while(bad.length < 5){
    const x = 2 + Math.floor(Math.random()*9), y = 2 + Math.floor(Math.random()*9);
    if(x*y === target || seen[x+"x"+y]) continue;
    seen[x+"x"+y] = 1; bad.push(x+" × "+y);
  }
  const items = good.map(t=>({txt:t,ok:true})).concat(bad.map(t=>({txt:t,ok:false}))).sort(()=>Math.random()-.5);
  const title = isBalloon ? ("\ud83c\udf88 " + T("balloonTitle")) : ("\ud83e\udee7 " + T("bubbleTitle"));
  modal('<div class="mini-head">'+ title +'</div><p>'+ (isBalloon ? T("balloonHow") : T("bubbleHow")) +'</p>'
    + '<div class="mini-target">'+ target +'</div>'
    + (untimed ? '<div style="height:8px"></div>' : '<div class="timer"><div class="timer-fill" id="tf"></div></div>')
    + '<div class="bubble-field" id="field"></div>'
    + '<div style="height:10px"></div><button class="btn green sm" id="bubDone">'+ T("done") +'</button>');
  const field = document.getElementById("field");
  let left = items.filter(i=>i.ok).length, t = 26 + extraTime(), T0 = t, ended = false;
  const bd = document.getElementById("bubDone");
  if(bd) bd.onclick = ()=>fin(left === 0);

  function layout(){
    const W = field.clientWidth || 300, H = field.clientHeight || 280;
    const SZ = 74, pad = 8, cols = 3, rows = Math.ceil(items.length/cols);
    const availW = Math.max(0, W - SZ - pad*2), availH = Math.max(0, H - SZ - pad*2);
    [...field.children].forEach((el, i)=>{
      const col = i % cols, row = Math.floor(i/cols);
      const jx = (Math.random()-.5)*10, jy = (Math.random()-.5)*8;
      const x = pad + (cols > 1 ? col*availW/(cols-1) : availW/2) + jx;
      const y = pad + (rows > 1 ? row*availH/(rows-1) : availH/2) + jy;
      el.style.left = clamp(x, pad, Math.max(pad, W - SZ - pad)) + "px";
      el.style.top  = clamp(y, pad, Math.max(pad, H - SZ - pad)) + "px";
    });
  }
  items.forEach((it, i)=>{
    const el = document.createElement("div");
    const col = PAL[i % PAL.length];
    el.className = "bub " + (isBalloon ? "balloon" : "bubble");
    if(isBalloon){
      el.style.background = col; el.style.color = col;
      const k = document.createElement("span"); k.className = "knot";
      const lab = document.createElement("span");
      lab.textContent = it.txt; lab.style.color = "#2c1c46"; lab.style.position = "relative";
      el.appendChild(k); el.appendChild(lab);
    } else {
      el.textContent = it.txt;
    }
    el.style.animationDuration = (3 + Math.random()*2.4) + "s";
    el.style.animationDelay = (-Math.random()*3) + "s";
    let handled = false, lastHit = 0;
    const hit = ev=>{
      if(ev && ev.preventDefault) ev.preventDefault();
      const now = Date.now();
      if(now - lastHit < 400) return;   /* pointerdown and click both fire; count once */
      lastHit = now;
      if(handled || ended || el.classList.contains("gone")) return;
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      if(it.ok){
        handled = true;
        el.classList.add("gone");
        el.classList.add(isBalloon ? "popL" : "popB");
        if(isBalloon) SFX.popBalloon(); else SFX.popBubble();
        confetti(cx, cy, isBalloon ? 22 : 14, isBalloon ? [col,"#fff",col] : ["#bfeaff","#fff","#8fd8ff"]);
        for(let k=0;k<3;k++){
          const sh = document.createElement("div");
          sh.className = "shard"; sh.textContent = isBalloon ? "\ud83c\udf8a" : "\ud83d\udca7";
          sh.style.left = (cx + (Math.random()-.5)*40) + "px";
          sh.style.top = (cy + (Math.random()-.5)*20) + "px";
          document.body.appendChild(sh);
          setTimeout(()=>sh.remove(), 750);
        }
        setTimeout(()=>{ el.style.visibility = "hidden"; }, 340);
        left--;
        G.coins += 3; P.coins += 3;
        const pc = document.getElementById("playCoins"); if(pc) pc.textContent = G.coins;
        if(left === 0) setTimeout(()=>fin(true), 380);
      } else {
        el.classList.remove("nope"); void el.offsetWidth; el.classList.add("nope");
        SFX.wrong();
        if(!untimed) t -= 2.5;
      }
    };
    el.addEventListener("pointerdown", hit);
    el.addEventListener("click", hit);
    field.appendChild(el);
  });
  requestAnimationFrame(layout);
  setTimeout(layout, 60);

  const iv = untimed ? null : setInterval(()=>{
    t -= .1;
    const el = document.getElementById("tf"); if(el) el.style.width = Math.max(0, 100*t/T0) + "%";
    if(t <= 0) fin(false);
  }, 100);
  function fin(win){
    if(ended) return; ended = true; if(iv) clearInterval(iv);
    if(win){ SFX.fanfare(); confetti(innerWidth/2, innerHeight/2, 60); G.coins += 12; P.coins += 12; gemUp(); }
    else SFX.wrong();
    const pc = document.getElementById("playCoins"); if(pc) pc.textContent = G.coins;
    save();
    setTimeout(()=>{
      modal('<h2>'+ (win ? (isBalloon ? "\ud83c\udf88 " : "\ud83e\udee7 ") + T("bubbleDone") : "\u23f0 " + T("timeUp")) +'</h2>'
        + (win ? '<div class="reward-row"><div class="reward">+12 \ud83e\ude99</div><div class="reward">+1 \ud83d\udc8e</div></div>' : "")
        + '<button class="btn green" id="okBtn">'+ T("tapContinue") +'</button>');
      document.getElementById("okBtn").onclick = ()=>{ closeModal(); done(); };
    }, 650);
  }
}
function miniTrueFalse(done){

    clearInterval(iv);
    iv = setInterval(()=>{
      t -= .1;

    G.coins += bonus; P.coins += bonus;

    modal('<h2>⚡ '+ score +' / '+ rounds +'</h2><div class="reward-row"><div class="reward">+'+bonus+' 🪙</div>'
      + (score === rounds ? '<div class="reward">+1 💎</div>' : '') + '</div>'
      + '<button class="btn green" id="okBtn">'+ T("tapContinue") +'</button>');

function finishWorld(){
  const acc = G.correct / G.total;
  const stars = acc >= .9 ? 3 : (acc >= .7 ? 2 : 1);
  P.stars[G.wi] = Math.max(P.stars[G.wi] || 0, stars);
  if(P.unlocked === G.wi + 1) P.unlocked = G.wi + 2;
  P.stats.sec += Math.round((Date.now() - G.t0)/1000);
  SFX.levelup();
  modal('<h2>🎉 '+ T("levelDone") +'</h2><div style="font-size:30px;letter-spacing:4px">'
    + "⭐".repeat(stars) + "☆".repeat(3-stars) + '</div><p>'+ T("chestTap") +'</p><div class="chest" id="chest">🎁</div>');
  document.getElementById("chest").onclick = ()=>openChest(stars);
  save();
}
function openChest(stars){
  let bonus = 20 + stars*8;
  if(buff("endbonus")) bonus += 15;
  let gems = stars >= 3 ? 1 : 0;
  if(buff("gem3star") && stars === 3) gems++;
  P.coins += bonus; P.gems += gems;
  let petHTML = "";
  const locked = PETS.map((p,i)=>i).filter(i=>P.pets.indexOf(i) < 0);
  if(locked.length && Math.random() < .55){
    const idx = pick(locked); P.pets.push(idx);
    petHTML = '<p>'+ T("newFriend") +'</p><div style="font-size:56px">'+ PETS[idx].e +'</div>'
      + '<div style="font-size:20px;font-weight:900">'+ PETS[idx][LANG] +'</div>';
  }
  P.buff = null;
  SFX.fanfare();
  confetti(innerWidth/2, innerHeight/2.4, 100);
  setTimeout(()=>confetti(innerWidth/4, innerHeight/2.6, 50), 240);
  setTimeout(()=>confetti(3*innerWidth/4, innerHeight/2.6, 50), 430);
  modal('<h2>✨</h2><div class="reward-row"><div class="reward">+'+ (G.coins + bonus) +' 🪙</div>'
    + '<div class="reward">+'+ (G.gems + gems) +' 💎</div></div>' + petHTML
    + '<p style="font-size:15px;opacity:.8;margin-top:10px">💡 '+ pick(T("facts")) +'</p>'
    + '<button class="btn green" id="okBtn">'+ T("home") +'</button>');
  document.getElementById("okBtn").onclick = ()=>{ closeModal(); G = null; enterHome(); };
  save();
}
function towerOver(){
  if(G.correct > P.tower) P.tower = G.correct;
  P.stats.sec += Math.round((Date.now() - G.t0)/1000);
  P.coins += G.correct * 2;
  save();
  modal('<h2>🗼 '+ T("gameOver") +'</h2><div class="reward-row"><div class="reward">'+ G.correct +'</div>'
    + '<div class="reward">'+ T("towerBest") +' '+ P.tower +'</div></div>'
    + '<button class="btn green" id="okBtn">'+ T("home") +'</button>');
  document.getElementById("okBtn").onclick = ()=>{ closeModal(); G = null; enterHome(); };
}

  ACC.filter(a=>a.slot === shopTab).forEach(a=>{

    const can = a.cur === "c" ? P.coins >= a.cost : P.gems >= a.cost;
    const d = document.createElement("div");
    d.className = "item" + (on ? " on" : (have ? " have" : (can ? "" : " cant")));
    const prev = monSVG(P.av, {eq: Object.assign({}, P.eq, {[a.slot]: a.id})}).replace('viewBox="0 -36 200 242"', 'viewBox="'+ZOOM[a.slot]+'"');
    d.innerHTML = '<div class="ic">'+ prev +'</div><div class="n">'+ a[LANG] +'</div>'
      + '<div class="p">'+ (have ? (on ? "✅ "+T("worn") : T("wear")) : (a.cost + (a.cur === "c" ? " 🪙" : " 💎"))) +'</div>'
      + (have || can ? "" : saveBar(a.cur === "c" ? P.coins/a.cost : P.gems/a.cost));
    d.onclick = ()=>{
      const msg = document.getElementById("shopMsg");
      if(have){ P.eq[a.slot] = on ? "" : a.id; SFX.pop(); save(); renderShop(); return; }
      if(!can){ SFX.wrong(); msg.textContent = T("poor"); d.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}], 250); return; }
      if(a.cur === "c") P.coins -= a.cost; else P.gems -= a.cost;
      P.owned.push(a.id); P.eq[a.slot] = a.id;
      SFX.gem(); confetti(innerWidth/2, innerHeight/2.6, 40);
      save(); renderShop();

function buyEgg(kind, cost, can){

function eatAnimation(monId, emoji, done){
  const wrap = document.getElementById(monId);
  if(!wrap){ done && done(); return; }
  const b = BODIES[P.av.body] || BODIES[0];
  const el = document.createElement("div");
  el.className = "bite"; el.textContent = emoji;
  el.style.left = "76%"; el.style.top = "72%";
  el.style.transform = "translate(-50%,-50%) scale(1)";
  wrap.appendChild(el);
  const mouthLeft = "50%", mouthTop = (b.mouthY/200*100) + "%";
  let bite = 0;
  const bites = 4;
  setTimeout(()=>{ el.style.left = mouthLeft; el.style.top = mouthTop; chomp(); }, 260);
  function chomp(){
    if(!el.isConnected) return;
    if(bite >= bites){
      el.remove(); setMouth(monId, "happy"); SFX.yum();
      const r = wrap.getBoundingClientRect();
      confetti(r.left + r.width/2, r.top + r.height*0.6, 26, ["#ffc93c","#ff8fae","#9ee37d"]);
      setTimeout(()=>{ SFX.gulp(); setTimeout(()=>SFX.burp(), 400); setMouth(monId, "idle"); done && done(); }, 480);
      return;
    }
    bite++;
    setMouth(monId, "open");
    SFX.chomp(bite);
    el.style.transform = "translate(-50%,-50%) scale(" + (1 - bite*0.22) + ")";
    const r = wrap.getBoundingClientRect();
    confetti(r.left + r.width/2, r.top + r.height*(b.mouthY/200), 6, ["#c98b4b","#ffd39b"]);
    setTimeout(()=>{ setMouth(monId, "idle"); setTimeout(chomp, 170); }, 210);
  }
}

  DB.players.forEach(p=>{
    const acc = p.stats.ans ? Math.round(100*p.stats.ok/p.stats.ans) : 0;
    const weak = Object.keys(p.mast).filter(k=>p.mast[k].w > 0)
      .sort((x,y)=>(p.mast[y].w - p.mast[y].c) - (p.mast[x].w - p.mast[x].c)).slice(0,5).map(k=>k.replace("x"," × ")).join(", ");
    const d = document.createElement("div");
    d.className = "card"; d.style.cssText = "width:100%;max-width:430px;margin:6px 0;text-align:left";
    d.innerHTML = '<div style="font-size:20px;font-weight:900">'+ p.name +'</div>'
      + '<div style="font-size:15px;font-weight:700">'+ T("world") +' '+ p.unlocked +' · '+ T("answered") +' '+ p.stats.ans
      + ' · '+ T("accuracy") +' '+ acc +'% · '+ T("minutes") +' '+ Math.round(p.stats.sec/60) +'</div>'
      + '<div style="font-size:15px;font-weight:700;margin-top:4px">'+ T("weakest") +': '+ (weak || T("allGood")) +'</div>';
    const sc = SDB.list.filter(x=>x.pid === p.id).length;
    if(sc){
      const sb = document.createElement("button");
      sb.className = "btn plain sm"; sb.style.marginTop = "8px";
      sb.textContent = "🎵 " + sc + " " + T("mySongs") + " — " + T("deleteSong");
      sb.onclick = ()=>{
        modal('<h2>🎵</h2><p>'+ T("areYouSure") +' '+ p.name +'?</p>'
          + '<button class="btn pink" id="yy2">'+ T("deleteSong") +'</button> <button class="btn green" id="nn2">'+ T("cancel") +'</button>');
        document.getElementById("nn2").onclick = closeModal;
        document.getElementById("yy2").onclick = ()=>{
          SDB.list = SDB.list.filter(x=>x.pid !== p.id);
          saveSongs(); closeModal(); renderParent();
        };
      };
      d.appendChild(sb);
      d.appendChild(document.createElement("br"));
    }
    const calm = document.createElement("button");
    calm.className = "btn sm"; calm.style.marginTop = "8px";
    calm.style.background = p.calm ? "var(--green)" : "var(--cream)";
    calm.textContent = (p.calm ? "✅ " : "⬜ ") + T("calmMode");
    calm.onclick = ()=>{ p.calm = !p.calm; save(); SFX.pop(); renderParent(); };
    d.appendChild(calm);
    d.appendChild(document.createElement("br"));
    const del = document.createElement("button");
    del.className = "btn pink sm"; del.style.marginTop = "8px"; del.textContent = T("erase");
    del.onclick = ()=>{
      modal('<h2>⚠️</h2><p>'+ T("areYouSure") +' '+ p.name +'?</p>'
        + '<button class="btn pink" id="yy">'+ T("erase") +'</button> <button class="btn green" id="nn">'+ T("cancel") +'</button>');
      document.getElementById("nn").onclick = closeModal;
      document.getElementById("yy").onclick = ()=>{
        DB.players = DB.players.filter(x=>x.id !== p.id);
        SDB.list = SDB.list.filter(x=>x.pid !== p.id);
        saveSongs();
        if(P && P.id === p.id) P = null;
        save(); closeModal(); renderParent();
      };
    };
    d.appendChild(del);
    body.appendChild(d);
  });
  const ex = document.createElement("div");
  ex.style.cssText = "width:100%;max-width:430px;margin-top:10px;text-align:center";
  ex.innerHTML = '<div class="sub-title" style="font-size:19px">'+ T("exportS") +'</div>'
    + '<textarea class="code" id="expCode" readonly>'+ b64(JSON.stringify(DB)) +'</textarea>'
    + '<div class="sub-title" style="font-size:19px">'+ T("importS") +'</div>'
    + '<textarea class="code" id="impCode"></textarea><div style="height:8px"></div>'
    + '<button class="btn green sm" id="impBtn">'+ T("restore") +'</button>';
  body.appendChild(ex);
  document.getElementById("impBtn").onclick = ()=>{
    const raw = unb64(document.getElementById("impCode").value);
    try{
      const o = JSON.parse(raw);
      if(o && o.players){ DB = o; P = null; save(); SFX.fanfare(); renderProfiles(); }
      else SFX.wrong();
    }catch(e){ SFX.wrong(); }
  };
  show("parent");
}

/* ---------------- wiring ---------------- */
function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "he" ? "rtl" : "ltr";
  document.getElementById("btnLang2").textContent = LANG === "he" ? "EN" : "עב";
  document.getElementById("monName").placeholder = T("name");
}
function backHome(){ SFX.pop(); renderHome(); }
document.getElementById("btnNewPlayer").onclick = ()=>{ SFX.whoosh(); openBuilder(false); };
document.getElementById("btnDice").onclick = ()=>{ WA = randAv(); SFX.pop(); drawBuilder(); };
document.getElementById("btnDone").onclick = ()=>finishBuilder();
document.getElementById("btnSwitch").onclick = ()=>{ SFX.pop(); renderProfiles(); };
document.getElementById("btnPlay").onclick = ()=>{ SFX.whoosh(); startWorld(Math.min(P.unlocked, WORLDS.length) - 1); };
document.getElementById("btnShop").onclick = ()=>{ SFX.whoosh(); renderShop(); show("shop"); };
document.getElementById("btnFood").onclick = ()=>{ SFX.whoosh(); renderFood(); show("food"); };
document.getElementById("btnMastery").onclick = ()=>{ SFX.pop(); renderMastery(); };
document.getElementById("btnSongs").onclick = ()=>{ SFX.whoosh(); renderSongs(); };
document.getElementById("btnSongsBack").onclick = backHome;
document.getElementById("btnEdit").onclick = ()=>{ SFX.pop(); openBuilder(true); };
document.getElementById("btnShopBack").onclick = backHome;
document.getElementById("btnFoodBack").onclick = backHome;
document.getElementById("btnMasteryBack").onclick = backHome;
document.getElementById("btnParentBack").onclick = ()=>{ SFX.pop(); renderProfiles(); };
document.getElementById("btnParent").onclick = ()=>parentGate(renderParent);
document.getElementById("btnSound").onclick = function(){
  DB.sound = !DB.sound; this.textContent = DB.sound ? "🔊" : "🔇"; save(); if(DB.sound) SFX.coin();
};
document.getElementById("btnLang2").onclick = ()=>{
  LANG = LANG === "he" ? "en" : "he"; DB.lang = LANG; applyLang(); save(); SFX.pop();
  if(document.getElementById("home").classList.contains("active")) renderHome(); else renderProfiles();
};
document.getElementById("btnQuit").onclick = ()=>{
  modal('<h2>👋</h2><p>'+ T("home") +'?</p><div class="reward-row">'
    + '<button class="btn green" id="stayB">▶</button><button class="btn pink" id="leaveB">🏠</button></div>');
  document.getElementById("stayB").onclick = closeModal;
  document.getElementById("leaveB").onclick = ()=>{
    cleanupMic();
    if(G) P.stats.sec += Math.round((Date.now() - G.t0)/1000);
    closeModal(); G = null; save(); enterHome();
  };
};
addEventListener("keydown", e=>{
  if(!document.getElementById("play").classList.contains("active")) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 4){ const b = document.getElementById("opts").children[n-1]; if(b) b.click(); }
});
document.addEventListener("pointerdown", function once(){ audioOn(); document.removeEventListener("pointerdown", once); });

(async function init(){
  const saved = await load();
  if(saved && saved.players) DB = Object.assign(DB, saved);
  DB.players.forEach(p=>{
    p.stars = p.stars || {}; p.mast = p.mast || {}; p.pets = p.pets || []; p.owned = p.owned || [];
    p.eq = p.eq || {head:"",eyes:"",neck:"",wrist:"",back:""};
    p.stats = p.stats || {ans:0, ok:0, sec:0, day:"", dayCount:0};
    if(p.tower === undefined) p.tower = 0;
  });
  try{ SDB = await loadSongs(); }catch(e){ SDB = {list:[]}; }
  if(!SDB || !SDB.list) SDB = {list:[]};
  LANG = DB.lang || "en";
  applyLang();
  document.getElementById("btnSound").textContent = DB.sound ? "🔊" : "🔇";
  if(!DB.players.length){ applyScene(0,0); openBuilder(false); }
  else renderProfiles();
})();
</script>
</body>
</html>
